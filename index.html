\u002Fcode><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:12px;padding:11px 20px;border-bottom:1px solid var(--border)\"><span data-icon=\"true\" style=\"--u:url(&quot;5e7b7a69-b9e9-489d-884b-2c10e81194c8&quot;);font-size:18px;color:var(--text-muted)\"><\u002Fspan><span style=\"font:500 13.5px/1 var(--font-sans);flex:1\">Feature Services<\u002Fspan><code style=\"font:500 11.5px var(--font-mono);color:var(--text-subtle)\">server-cog<\u002Fcode><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:12px;padding:11px 20px;border-bottom:1px solid var(--border)\"><span data-icon=\"true\" style=\"--u:url(&quot;ed81cd93-3504-4a83-ba0f-4815b2dc4e18&quot;);font-size:18px;color:var(--text-muted)\"><\u002Fspan><span style=\"font:500 13.5px/1 var(--font-sans);flex:1\">Quick Start<\u002Fspan><code style=\"font:500 11.5px var(--font-mono);color:var(--text-subtle)\">sparkles<\u002Fcode><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:12px;padding:11px 20px;border-bottom:1px solid var(--border)\"><span data-icon=\"true\" style=\"--u:url(&quot;eb7b3a15-d36f-4572-b156-b06bf82d1b6e&quot;);font-size:18px;color:var(--text-muted)\"><\u002Fspan><span style=\"font:500 13.5px/1 var(--font-sans);flex:1\">Use Cases<\u002Fspan><code style=\"font:500 11.5px var(--font-mono);color:var(--text-subtle)\">target<\u002Fcode><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:12px;padding:11px 20px;border-bottom:1px solid var(--border)\"><span data-icon=\"true\" style=\"--u:url(&quot;d569b505-7b64-4750-9889-d34e086e5da4&quot;);font-size:18px;color:var(--text-muted)\"><\u002Fspan><span style=\"font:500 13.5px/1 var(--font-sans);flex:1\">Model Development<\u002Fspan><code style=\"font:500 11.5px var(--font-mono);color:var(--text-subtle)\">file-code-2<\u002Fcode><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:12px;padding:11px 20px\"><span data-icon=\"true\" style=\"--u:url(&quot;30c4c1a8-8133-4531-8511-b1bc172fe0e7&quot;);font-size:18px;color:var(--text-muted)\"><\u002Fspan><span style=\"font:500 13.5px/1 var(--font-sans);flex:1\">Workflow Builder<\u002Fspan><code style=\"font:500 11.5px var(--font-mono);color:var(--text-subtle)\">workflow<\u002Fcode><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-code=\"true\" style=\"margin-top:18px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);overflow:hidden\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 10px 9px 16px;border-bottom:1px solid var(--border)\"><span style=\"font:700 10.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">Icon usage<\u002Fspan><button sc-camel-on-click=\"{{ copy }}\" style=\"border:1px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:7px;padding:5px 11px;font:600 11px/1 var(--font-sans);cursor:pointer\" style-hover=\"color:var(--primary);border-color:var(--primary)\">Copy<\u002Fbutton><\u002Fdiv>\n          <pre data-scroll=\"true\" style=\"margin:0;padding:16px;overflow:auto;font:400 12.5px/1.75 var(--font-mono);color:var(--text-muted)\">import { Bot } from \"lucide-react\";\n\n&lt;Bot sc-camel-class-name=\"size-5 shrink-0\" sc-camel-stroke-width={1.75} aria-hidden /&gt;\n\n/* Icon-only controls must carry a label */\n&lt;button aria-label=\"Delete version\"&gt;\n  &lt;Trash2 sc-camel-class-name=\"size-4\" sc-camel-stroke-width={1.75} aria-hidden /&gt;\n&lt;/button&gt;<\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"loading\" style=\"padding:72px 0 76px;border-bottom:1px solid var(--border)\">\n        <span style=\"font:700 11px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--primary)\">01.6 — Foundations<\u002Fspan>\n        <h2 style=\"margin:14px 0 0;font:800 34px/1.12 var(--font-sans);letter-spacing:-.025em\">Loading &amp; progress<\u002Fh2>\n        <p style=\"margin:14px 0 0;max-width:74ch;font:400 15.5px/1.7 var(--font-sans);color:var(--text-muted);text-wrap:pretty\">AI work is slow work — retrieval, inference and guardrails all take real time. The loader is therefore a first-class brand asset, not an afterthought. UnifyAI OS uses <strong style=\"color:var(--text)\">one spinner<\u002Fstrong> everywhere, in three sizes, plus a brand mark loader reserved for page and app boot.<\u002Fp>\n\n        <h3 style=\"margin:40px 0 16px;font:700 16px/1.3 var(--font-sans);letter-spacing:-.01em\">The loader<\u002Fh3>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px\">\n          <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:26px;display:flex;flex-direction:column;gap:22px\">\n            <span style=\"font:700 10.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">Arc spinner — the default<\u002Fspan>\n            <div style=\"display:flex;align-items:center;justify-content:center;gap:34px;padding:14px 0\">\n              <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\">\n                <span data-loader=\"sm\" style=\"display:inline-grid;place-items:center;width:16px;height:16px\"><svg sc-camel-view-box=\"0 0 44 44\" style=\"width:16px;height:16px;animation:dsw-orbit 1.4s linear infinite\" aria-hidden=\"true\"><circle cx=\"22\" cy=\"22\" r=\"18\" fill=\"none\" stroke=\"var(--surface-3)\" stroke-width=\"5\"><\u002Fcircle><circle data-loader-arc=\"true\" cx=\"22\" cy=\"22\" r=\"18\" fill=\"none\" stroke=\"var(--primary)\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-dasharray=\"113\" style=\"animation:dsw-dash 1.4s ease-in-out infinite\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n                <span style=\"font:500 11px/1 var(--font-mono);color:var(--text-subtle)\">16 · inline<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\">\n                <span data-loader=\"md\" style=\"display:inline-grid;place-items:center;width:24px;height:24px\"><svg sc-camel-view-box=\"0 0 44 44\" style=\"width:24px;height:24px;animation:dsw-orbit 1.4s linear infinite\" aria-hidden=\"true\"><circle cx=\"22\" cy=\"22\" r=\"18\" fill=\"none\" stroke=\"var(--surface-3)\" stroke-width=\"4.5\"><\u002Fcircle><circle data-loader-arc=\"true\" cx=\"22\" cy=\"22\" r=\"18\" fill=\"none\" stroke=\"var(--primary)\" stroke-width=\"4.5\" stroke-linecap=\"round\" stroke-dasharray=\"113\" style=\"animation:dsw-dash 1.4s ease-in-out infinite\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n                <span style=\"font:500 11px/1 var(--font-mono);color:var(--text-subtle)\">24 · in card<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;align-items:center;gap:10px\">\n                <span data-loader=\"lg\" role=\"status\" aria-label=\"Loading\" style=\"display:inline-grid;place-items:center;width:44px;height:44px\"><svg sc-camel-view-box=\"0 0 44 44\" style=\"width:44px;height:44px;animation:dsw-orbit 1.4s linear infinite\" aria-hidden=\"true\"><circle cx=\"22\" cy=\"22\" r=\"18\" fill=\"none\" stroke=\"var(--surface-3)\" stroke-width=\"3.5\"><\u002Fcircle><circle data-loader-arc=\"true\" cx=\"22\" cy=\"22\" r=\"18\" fill=\"none\" stroke=\"var(--primary)\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-dasharray=\"113\" style=\"animation:dsw-dash 1.4s ease-in-out infinite\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n                <span style=\"font:500 11px/1 var(--font-mono);color:var(--text-subtle)\">44 · region<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:0;font:400 12.5px/1.65 var(--font-sans);color:var(--text-subtle)\">Track in <code style=\"font:500 11.5px var(--font-mono)\">--surface-3<\u002Fcode>, arc in <code style=\"font:500 11.5px var(--font-mono)\">--primary<\u002Fcode>, round caps, 1.4s. The arc grows and shrinks while the whole ring rotates — never a bare quarter-circle chase.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:26px;display:flex;flex-direction:column;gap:22px\">\n            <span style=\"font:700 10.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">Brand mark loader — boot &amp; full page only<\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:14px 0\">\n              <span data-loader=\"brand\" role=\"status\" aria-label=\"Loading UnifyAI OS\" style=\"display:inline-flex;color:var(--primary)\"><svg sc-camel-view-box=\"0 0 392 122\" style=\"width:230px;height:auto;overflow:visible\" aria-hidden=\"true\"><g stroke=\"currentColor\" stroke-width=\"19\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><path d=\"M83 9 H100 A51 51 0 0 1 100 111 H83\" style=\"animation:dsw-breathe 1.6s ease-in-out infinite\"><\u002Fpath><path d=\"M246 30 C246 12 228 4 210 4 C190 4 172 14 172 33 C172 51 191 57 211 61 C231 65 250 72 250 91 C250 110 231 117 211 117 C191 117 172 108 170 90\" style=\"animation:dsw-breathe 1.6s ease-in-out .12s infinite\"><\u002Fpath><path d=\"M272 6 L296 114 L324 34 L352 114 L376 6\" style=\"animation:dsw-breathe 1.6s ease-in-out .24s infinite\"><\u002Fpath><path d=\"M7 9 h0\" data-loader-arc=\"true\" style=\"animation:dsw-stream 1.6s cubic-bezier(.4,0,.2,1) 0s infinite\"><\u002Fpath><path d=\"M33 9 H74\" data-loader-arc=\"true\" style=\"animation:dsw-stream 1.6s cubic-bezier(.4,0,.2,1) 0s infinite\"><\u002Fpath><path d=\"M13 45 H74\" data-loader-arc=\"true\" style=\"animation:dsw-stream 1.6s cubic-bezier(.4,0,.2,1) .13s infinite\"><\u002Fpath><path d=\"M97 45 h0\" data-loader-arc=\"true\" style=\"animation:dsw-stream 1.6s cubic-bezier(.4,0,.2,1) .13s infinite\"><\u002Fpath><path d=\"M22 78 H92\" data-loader-arc=\"true\" style=\"animation:dsw-stream 1.6s cubic-bezier(.4,0,.2,1) .26s infinite\"><\u002Fpath><path d=\"M52 108 h0\" data-loader-arc=\"true\" style=\"animation:dsw-stream 1.6s cubic-bezier(.4,0,.2,1) .39s infinite\"><\u002Fpath><\u002Fg><\u002Fsvg><\u002Fspan>\n              <span style=\"font:600 12.5px/1 var(--font-sans);color:var(--text-muted)\">Starting UnifyAI OS…<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0;font:400 12.5px/1.65 var(--font-sans);color:var(--text-subtle)\">The full DSW wordmark: the three motion lines stream through the open <strong style=\"color:var(--text)\">D<\u002Fstrong> on a 130ms stagger while the letters breathe in sequence. Single colour, <code style=\"font:500 11.5px var(--font-mono)\">currentColor<\u002Fcode>, 1.6s loop. Use once per session at most — it says <em>the platform is starting<\u002Fem>, not <em>this request is running<\u002Fem>.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:26px;display:flex;flex-direction:column;gap:22px\">\n            <span style=\"font:700 10.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">Streaming dots — agent is thinking<\u002Fspan>\n            <div style=\"display:flex;align-items:center;justify-content:center;gap:12px;padding:22px 0\">\n              <span data-loader=\"dots\" style=\"display:inline-flex;gap:5px;padding:11px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2)\">\n                <span data-loader-arc=\"true\" style=\"width:7px;height:7px;border-radius:99px;background:var(--text-subtle);animation:dsw-dot 1.3s ease-in-out infinite\"><\u002Fspan>\n                <span data-loader-arc=\"true\" style=\"width:7px;height:7px;border-radius:99px;background:var(--text-subtle);animation:dsw-dot 1.3s ease-in-out .16s infinite\"><\u002Fspan>\n                <span data-loader-arc=\"true\" style=\"width:7px;height:7px;border-radius:99px;background:var(--text-subtle);animation:dsw-dot 1.3s ease-in-out .32s infinite\"><\u002Fspan>\n              <\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0;font:400 12.5px/1.65 var(--font-sans);color:var(--text-subtle)\">Only inside a chat or inference transcript, in the position the answer will occupy. It is replaced by the first streamed token, never stacked above it.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3 style=\"margin:44px 0 16px;font:700 16px/1.3 var(--font-sans);letter-spacing:-.01em\">Brand loader variants<\u002Fh3>\n        <p style=\"margin:0 0 18px;max-width:74ch;font:400 14px/1.7 var(--font-sans);color:var(--text-muted)\">Four sanctioned animations of the full <strong style=\"color:var(--text)\">DSW<\u002Fstrong> wordmark. Pick by <em>what the wait means<\u002Fem>, never by taste — and only one variant may appear in a product surface. Each is drawn in a single path colour inheriting <code style=\"font:500 13px var(--font-mono);color:var(--text)\">currentColor<\u002Fcode>, so it holds up in both themes. Minimum width 160px; below that, drop to the arc spinner rather than shrinking the wordmark.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px\">\n          <div style=\"border:1px solid var(--border);border-radius:12px;background:var(--surface-2);padding:20px 18px;display:flex;flex-direction:column;align-items:center;gap:14px\">\n            <span data-loader=\"brand\" role=\"status\" aria-label=\"Loading\" style=\"display:inline-flex;justify-content:center;color:var(--primary)\"><svg sc-camel-view-box=\"0 0 392 122\" style=\"width:168px;height:auto;overflow:visible\" aria-hidden=\"true\"><g stroke=\"currentColor\" stroke-width=\"19\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\" stroke-dasharray=\"300\"><path d=\"M83 9 H100 A51 51 0 0 1 100 111 H83\" sc-camel-path-length=\"300\" data-loader-arc=\"true\" style=\"animation:dsw-trace 2.4s cubic-bezier(.4,0,.2,1) .1s infinite\"><\u002Fpath><path d=\"M246 30 C246 12 228 4 210 4 C190 4 172 14 172 33 C172 51 191 57 211 61 C231 65 250 72 250 91 C250 110 231 117 211 117 C191 117 172 108 170 90\" sc-camel-path-length=\"300\" data-loader-arc=\"true\" style=\"animation:dsw-trace 2.4s cubic-bezier(.4,0,.2,1) .28s infinite\"><\u002Fpath><path d=\"M272 6 L296 114 L324 34 L352 114 L376 6\" sc-camel-path-length=\"300\" data-loader-arc=\"true\" style=\"animation:dsw-trace 2.4s cubic-bezier(.4,0,.2,1) .46s infinite\"><\u002Fpath><path d=\"M7 9 h0\" sc-camel-path-length=\"300\" data-loader-arc=\"true\" style=\"animation:dsw-trace 2.4s cubic-bezier(.4,0,.2,1) 0s infinite\"><\u002Fpath><path d=\"M33 9 H74\" sc-camel-path-length=\"300\" data-loader-arc=\"true\" style=\"animation:dsw-trace 2.4s cubic-bezier(.4,0,.2,1) 0s infinite\"><\u002Fpath><path d=\"M13 45 H74\" sc-camel-path-length=\"300\" data-loader-arc=\"true\" style=\"animation:dsw-trace 2.4s cubic-bezier(.4,0,.2,1) .05s infinite\"><\u002Fpath><path d=\"M97 45 h0\" sc-camel-path-length=\"300\" data-loader-arc=\"true\" style=\"animation:dsw-trace 2.4s cubic-bezier(.4,0,.2,1) .05s infinite\"><\u002Fpath><path d=\"M22 78 H92\" sc-camel-path-length=\"300\" data-loader-arc=\"true\" style=\"animation:dsw-trace 2.4s cubic-bezier(.4,0,.2,1) .1s infinite\"><\u002Fpath><path d=\"M52 108 h0\" sc-camel-path-length=\"300\" data-loader-arc=\"true\" style=\"animation:dsw-trace 2.4s cubic-bezier(.4,0,.2,1) .15s infinite\"><\u002Fpath><\u002Fg><\u002Fsvg><\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center\">\n              <strong style=\"font:700 12.5px/1.3 var(--font-sans);color:var(--text)\">Trace · 2.4s<\u002Fstrong>\n              <span style=\"font:400 11.5px/1.5 var(--font-sans);color:var(--text-subtle);text-wrap:pretty\">App boot and first paint. The mark writes itself, so the wait feels like construction.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:12px;background:var(--surface-2);padding:20px 18px;display:flex;flex-direction:column;align-items:center;gap:14px\">\n            <span data-loader=\"brand\" role=\"status\" aria-label=\"Loading\" style=\"display:inline-flex;justify-content:center;color:var(--primary)\"><svg sc-camel-view-box=\"0 0 392 122\" style=\"width:168px;height:auto;overflow:visible\" aria-hidden=\"true\"><g stroke=\"currentColor\" stroke-width=\"19\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\"><path d=\"M7 9 h0\" data-loader-arc=\"true\" style=\"transform-box:fill-box;transform-origin:left center;animation:dsw-pop 1.9s cubic-bezier(.4,0,.2,1) 0s infinite\"><\u002Fpath><path d=\"M33 9 H74\" data-loader-arc=\"true\" style=\"transform-box:fill-box;transform-origin:left center;animation:dsw-pop 1.9s cubic-bezier(.4,0,.2,1) 0s infinite\"><\u002Fpath><path d=\"M13 45 H74\" data-loader-arc=\"true\" style=\"transform-box:fill-box;transform-origin:left center;animation:dsw-pop 1.9s cubic-bezier(.4,0,.2,1) .09s infinite\"><\u002Fpath><path d=\"M97 45 h0\" data-loader-arc=\"true\" style=\"transform-box:fill-box;transform-origin:left center;animation:dsw-pop 1.9s cubic-bezier(.4,0,.2,1) .09s infinite\"><\u002Fpath><path d=\"M22 78 H92\" data-loader-arc=\"true\" style=\"transform-box:fill-box;transform-origin:left center;animation:dsw-pop 1.9s cubic-bezier(.4,0,.2,1) .18s infinite\"><\u002Fpath><path d=\"M52 108 h0\" data-loader-arc=\"true\" style=\"transform-box:fill-box;transform-origin:left center;animation:dsw-pop 1.9s cubic-bezier(.4,0,.2,1) .27s infinite\"><\u002Fpath><path d=\"M83 9 H100 A51 51 0 0 1 100 111 H83\" data-loader-arc=\"true\" style=\"transform-box:fill-box;transform-origin:left center;animation:dsw-pop 1.9s cubic-bezier(.4,0,.2 0\" style=\"opacity:.26\"><\u002Fpath><path d=\"M33 9 H74\" style=\"opacity:.26\"><\u002Fpath><path d=\"M13 45 H74\" style=\"opacity:.26\"><\u002Fpath><path d=\"M97 45 h0\" style=\"opacity:.26\"><\u002Fpath><path d=\"M22 78 H92\" style=\"opacity:.26\"><\u002Fpath><path d=\"M52 108 h0\" style=\"opacity:.26\"><\u002Fpath><g data-loader-arc=\"true\" style=\"transform-box:view-box;transform-origin:100px 60px;animation:dsw-ring 1.5s linear infinite\"><path d=\"M151 60 h0\" stroke-width=\"23\"><\u002Fpath><\u002Fg><\u002Fg><\u002Fsvg><\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center\">\n              <strong style=\"font:700 12.5px/1.3 var(--font-sans);color:var(--text)\">Orbit · 1.5s<\u002Fstrong>\n              <span style=\"font:400 11.5px/1.5 var(--font-sans);color:var(--text-subtle);text-wrap:pretty\">Indeterminate background work with no stages to report. The quietest of the four.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:12px;background:var(--surface-2);padding:20px 18px;display:flex;flex-direction:column;align-items:center;gap:14px\">\n            <span data-loader=\"brand\" role=\"status\" aria-label=\"Loading\" style=\"display:inline-flex;justify-content:center;color:var(--primary)\"><svg sc-camel-view-box=\"0 0 392 122\" style=\"width:168px;height:auto;overflow:visible\" aria-hidden=\"true\"><defs><clipPath id=\"dswRise\"><rect data-loader-arc=\"true\" x=\"-30\" y=\"122\" width=\"460\" height=\"150\" style=\"animation:dsw-rise 2.4s cubic-bezier(.4,0,.2,1) infinite\"><\u002Frect><\u002FclipPath><\u002Fdefs><g stroke=\"currentColor\" stroke-width=\"19\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\" style=\"opacity:.2\"><path d=\"M83 9 H100 A51 51 0 0 1 100 111 H83\"><\u002Fpath><path d=\"M246 30 C246 12 228 4 210 4 C190 4 172 14 172 33 C172 51 191 57 211 61 C231 65 250 72 250 91 C250 110 231 117 211 117 C191 117 172 108 170 90\"><\u002Fpath><path d=\"M272 6 L296 114 L324 34 L352 114 L376 6\"><\u002Fpath><path d=\"M7 9 h0\"><\u002Fpath><path d=\"M33 9 H74\"><\u002Fpath><path d=\"M13 45 H74\"><\u002Fpath><path d=\"M97 45 h0\"><\u002Fpath><path d=\"M22 78 H92\"><\u002Fpath><path d=\"M52 108 h0\"><\u002Fpath><\u002Fg><g stroke=\"currentColor\" stroke-width=\"19\" stroke-linecap=\"round\" stroke-linejoin=\"round\" fill=\"none\" clip-path=\"url(#dswRise)\"><path d=\"M83 9 H100 A51 51 0 0 1 100 111 H83\"><\u002Fpath><path d=\"M246 30 C246 12 228 4 210 4 C190 4 172 14 172 33 C172 51 191 57 211 61 C231 65 250 72 250 91 C250 110 231 117 211 117 C191 117 172 108 170 90\"><\u002Fpath><path d=\"M272 6 L296 114 L324 34 L352 114 L376 6\"><\u002Fpath><path d=\"M7 9 h0\"><\u002Fpath><path d=\"M33 9 H74\"><\u002Fpath><path d=\"M13 45 H74\"><\u002Fpath><path d=\"M97 45 h0\"><\u002Fpath><path d=\"M22 78 H92\"><\u002Fpath><path d=\"M52 108 h0\"><\u002Fpath><\u002Fg><\u002Fsvg><\u002Fspan>\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center\">\n              <strong style=\"font:700 12.5px/1.3 var(--font-sans);color:var(--text)\">Fill · 2.4s<\u002Fstrong>\n              <span style=\"font:400 11.5px/1.5 var(--font-sans);color:var(--text-subtle);text-wrap:pretty\">Determinate long jobs. Pair with a percentage; the fill height should track real progress.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3 style=\"margin:44px 0 16px;font:700 16px/1.3 var(--font-sans);letter-spacing:-.01em\">Which loader, when<\u002Fh3>\n        <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden\">\n          <div style=\"display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,1.2fr);gap:0;padding:13px 20px;background:var(--surface-2);border-bottom:1px solid var(--border)\"><span style=\"font:700 10.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">Duration<\u002Fspan><span style=\"font:700 10.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">Show<\u002Fspan><span style=\"font:700 10.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">Because<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,1.2fr);padding:13px 20px;border-bottom:1px solid var(--border);font:400 13.5px/1.5 var(--font-sans);color:var(--text-muted)\"><code style=\"font:500 12.5px var(--font-mono);color:var(--text)\">&lt; 300ms<\u002Fcode><span style=\"color:var(--text)\">Nothing<\u002Fspan><span>A flash of spinner reads as a glitch. Keep the control in its pressed state.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,1.2fr);padding:13px 20px;border-bottom:1px solid var(--border);font:400 13.5px/1.5 var(--font-sans);color:var(--text-muted)\"><code style=\"font:500 12.5px var(--font-mono);color:var(--text)\">0.3 – 1s<\u002Fcode><span style=\"color:var(--text)\">16px arc in the button<\u002Fspan><span>The button label changes to the present participle and the button disables.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,1.2fr);padding:13px 20px;border-bottom:1px solid var(--border);font:400 13.5px/1.5 var(--font-sans);color:var(--text-muted)\"><code style=\"font:500 12.5px var(--font-mono);color:var(--text)\">1 – 5s<\u002Fcode><span style=\"color:var(--text)\">Skeleton of the real layout<\u002Fspan><span>Preserves position, prevents the page jumping when content lands.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,1.2fr);padding:13px 20px;border-bottom:1px solid var(--border);font:400 13.5px/1.5 var(--font-sans);color:var(--text-muted)\"><code style=\"font:500 12.5px var(--font-mono);color:var(--text)\">&gt; 5s<\u002Fcode><span style=\"color:var(--text)\">Determinate progress + stage label<\u002Fspan><span>Long AI jobs need to name the stage: <em>Chunking · Embedding · Indexing<\u002Fem>.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:120px minmax(0,1fr) minmax(0,1.2fr);padding:13px 20px;font:400 13.5px/1.5 var(--font-sans);color:var(--text-muted)\"><code style=\"font:500 12.5px var(--font-mono);color:var(--text)\">Boot<\u002Fcode><span style=\"color:var(--text)\">Brand mark loader<\u002Fspan><span>Only while the shell itself is unavailable. Never inside a loaded page.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3 style=\"margin:44px 0 16px;font:700 16px/1.3 var(--font-sans);letter-spacing:-.01em\">Live <span style=\"font:400 13px/1 var(--font-sans);color:var(--text-subtle)\">— run these<\u002Fspan><\u002Fh3>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px\">\n          <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:18px;min-height:262px\">\n            <span style=\"font:700 10.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">Button → skeleton → result<\u002Fspan>\n            <div style=\"display:flex;gap:10px\">\n              <button sc-camel-on-click=\"{{ runLoadDemo }}\" disabled=\"{{ demoBusy }}\" style=\"display:inline-flex;align-items:center;gap:9px;height:38px;padding:0 18px;border:1px solid var(--primary);border-radius:999px;background:var(--primary);color:var(--primary-fg);font:600 13px/1 var(--font-sans);cursor:pointer;opacity:{{ demoBtnOpacity }}\" style-hover=\"background:var(--primary-hover)\">\n                <span style=\"display:{{ demoSpinnerDisplay }};width:16px;height:16px\"><svg sc-camel-view-box=\"0 0 44 44\" style=\"width:16px;height:16px;animation:dsw-orbit 1.4s linear infinite\" aria-hidden=\"true\"><circle cx=\"22\" cy=\"22\" r=\"18\" fill=\"none\" stroke=\"rgba(255,255,255,.35)\" stroke-width=\"5\"><\u002Fcircle><circle data-loader-arc=\"true\" cx=\"22\" cy=\"22\" r=\"18\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-dasharray=\"113\" style=\"animation:dsw-dash 1.4s ease-in-out infinite\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n                {{ demoBtnLabel }}\n              <\u002Fbutton>\n              <button sc-camel-on-click=\"{{ resetLoadDemo }}\" style=\"height:38px;padding:0 16px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text-muted);font:600 13px/1 var(--font-sans);cursor:pointer\" style-hover=\"border-color:var(--primary);color:var(--primary)\">Reset<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:{{ demoIdleDisplay }};padding:20px;border:1px dashed var(--border-strong);border-radius:12px;font:400 13px/1.6 var(--font-sans);color:var(--text-subtle)\">No result yet. Run the agent to see the loading sequence.<\u002Fdiv>\n            <div style=\"display:{{ demoLoadingDisplay }};flex-direction:column;gap:11px\">\n              <div data-skel=\"true\" style=\"height:12px;width:70%;border-radius:5px;\"><\u002Fdiv>\n              <div data-skel=\"true\" style=\"height:12px;width:100%;border-radius:5px;\"><\u002Fdiv>\n              <div data-skel=\"true\" style=\"height:12px;width:88%;border-radius:5px;\"><\u002Fdiv>\n              <span style=\"font:500 12px/1 var(--font-sans);color:var(--text-subtle);margin-top:4px\">Retrieving context · 5 chunks<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:{{ demoDoneDisplay }};flex-direction:column;gap:10px;padding:16px 18px;border:1px solid var(--border);border-left:3px solid var(--success);border-radius:12px;background:var(--surface-2)\">\n              <strong style=\"font:700 13px/1.4 var(--font-sans);color:var(--text)\">Sum assured: ₹25,00,000<\u002Fstrong>\n              <span style=\"font:400 13px/1.6 var(--font-sans);color:var(--text-muted)\">Extracted from clause 4.2 of the uploaded policy document.<\u002Fspan>\n              <span style=\"font:500 11.5px/1 var(--font-mono);color:var(--text-subtle)\">842 ms · 1,204 tokens · guardrails passed<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:18px;min-height:262px\">\n            <span style=\"font:700 10.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">Full-page boot loader<\u002Fspan>\n            <p style=\"margin:0;font:400 13.5px/1.65 var(--font-sans);color:var(--text-muted)\">Covers the viewport at <code style=\"font:500 12.5px var(--font-mono);color:var(--text)\">--bg<\u002Fcode> with the DSW wordmark centred and one line of copy. No spinner, no progress bar, no logo animation beyond the sanctioned four.<\u002Fp>\n            <button sc-camel-on-click=\"{{ showBoot }}\" style=\"align-self:flex-start;height:38px;padding:0 18px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text-muted);font:600 13px/1 var(--font-sans);cursor:pointer\" style-hover=\"border-color:var(--primary);color:var(--primary)\">Show boot loader<\u002Fbutton>\n            <div style=\"margin-top:auto;display:flex;flex-direction:column;gap:10px\">\n              <div style=\"display:flex;justify-content:space-between;font:600 12.5px/1 var(--font-sans);color:var(--text)\"><span>Indexing knowledge base<\u002Fspan><span style=\"font-family:var(--font-mono);color:var(--text-muted)\">Embedding · 3 of 4<\u002Fspan><\u002Fdiv>\n              <div style=\"height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden\"><div style=\"width:74%;height:100%;background:var(--primary);border-radius:999px\"><\u002Fdiv><\u002Fdiv>\n              <span style=\"font:400 12px/1.5 var(--font-sans);color:var(--text-subtle)\">Long jobs name the stage. \"Loading…\" alone is never acceptable past five seconds.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div data-code=\"true\" style=\"margin-top:18px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);overflow:hidden\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 10px 9px 16px;border-bottom:1px solid var(--border)\"><span style=\"font:700 10.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">Spinner component<\u002Fspan><button sc-camel-on-click=\"{{ copy }}\" style=\"border:1px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:7px;padding:5px 11px;font:600 11px/1 var(--font-sans);cursor:pointer\" style-hover=\"color:var(--primary);border-color:var(--primary)\">Copy<\u002Fbutton><\u002Fdiv>\n          <pre data-scroll=\"true\" style=\"margin:0;padding:16px;overflow:auto;font:400 12.5px/1.75 var(--font-mono);color:var(--text-muted)\">export function Spinner({ size = 24, className }: { size?: 16 | 24 | 44; className?: string }) {\n  return (\n    &lt;span role=\"status\" aria-label=\"Loading\" sc-camel-class-name={cn(\"inline-grid place-items-center\", className)}&gt;\n      &lt;svg sc-camel-view-box=\"0 0 44 44\" width={size} height={size} sc-camel-class-name=\"animate-[spin_1.4s_linear_infinite]\" aria-hidden&gt;\n        &lt;circle cx=\"22\" cy=\"22\" r=\"18\" fill=\"none\" stroke=\"var(--surface-3)\" sc-camel-stroke-width={5} /&gt;\n        &lt;circle cx=\"22\" cy=\"22\" r=\"18\" fill=\"none\" stroke=\"var(--primary)\" sc-camel-stroke-width={5}\n                sc-camel-stroke-linecap=\"round\" sc-camel-stroke-dasharray={113}\n                sc-camel-class-name=\"animate-[dsw-dash_1.4s_ease-in-out_infinite]\" /&gt;\n      &lt;/svg&gt;\n    &lt;/span&gt;\n  );\n}\n\n/* tailwind.config — keyframes */\n\"dsw-dash\": { \"0%,100%\": { strokeDashoffset: \"108\" }, \"50%\": { strokeDashoffset: \"30\" } }\n\n&lt;Button disabled={isPending}&gt;\n  {isPending &amp;&amp; &lt;Spinner size={16} sc-camel-class-name=\"text-current\" /&gt;}\n  {isPending ? \"Running agent…\" : \"Run agent\"}\n&lt;/Button&gt;<\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"motion\" style=\"padding:72px 0 76px;border-bottom:1px solid var(--border)\">\n        <span style=\"font:700 11px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--primary)\">01.7 — Foundations<\u002Fspan>\n        <h2 style=\"margin:14px 0 0;font:800 34px/1.12 var(--font-sans);letter-spacing:-.025em\">Motion<\u002Fh2>\n        <p style=\"margin:14px 0 0;max-width:72ch;font:400 15.5px/1.7 var(--font-sans);color:var(--text-muted);text-wrap:pretty\">Motion confirms an action happened; it never entertains. Nothing animates longer than 240ms except a streaming response. All of it is suppressed under <code style=\"font:500 13px var(--font-mono);color:var(--text)\">prefers-reduced-motion<\u002Fcode>.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:28px\">\n          <div style=\"border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:20px\"><strong style=\"font:700 13px/1.3 var(--font-sans)\">Instant · 120ms<\u002Fstrong><p style=\"margin:6px 0 0;font:400 12.5px/1.6 var(--font-sans);color:var(--text-muted)\">Hover, focus ring, colour change. <code style=\"font:500 11.5px var(--font-mono)\">ease-out<\u002Fcode><\u002Fp><\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:20px\"><strong style=\"font:700 13px/1.3 var(--font-sans)\">Quick · 180ms<\u002Fstrong><p style=\"margin:6px 0 0;font:400 12.5px/1.6 var(--font-sans);color:var(--text-muted)\">Tab slide, accordion, toggle knob. <code style=\"font:500 11.5px var(--font-mono)\">cubic-bezier(.2,.8,.3,1)<\u002Fcode><\u002Fp><\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:20px\"><strong style=\"font:700 13px/1.3 var(--font-sans)\">Considered · 240ms<\u002Fstrong><p style=\"margin:6px 0 0;font:400 12.5px/1.6 var(--font-sans);color:var(--text-muted)\">Modal, drawer, toast entrance. <code style=\"font:500 11.5px var(--font-mono)\">cubic-bezier(.16,1,.3,1)<\u002Fcode><\u002Fp><\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:20px\"><strong style=\"font:700 13px/1.3 var(--font-sans)\">Continuous<\u002Fstrong><p style=\"margin:6px 0 0;font:400 12.5px/1.6 var(--font-sans);color:var(--text-muted)\">Spinner 700ms linear · skeleton shimmer 1.4s · live dot pulse 2s.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"buttons\" style=\"padding:72px 0 76px;border-bottom:1px solid var(--border)\">\n        <span style=\"font:700 11px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--primary)\">02 — Components<\u002Fspan>\n        <h2 style=\"margin:14px 0 0;font:800 34px/1.12 var(--font-sans);letter-spacing:-.025em\">Buttons<\u002Fh2>\n        <p style=\"margin:14px 0 0;max-width:72ch;font:400 15.5px/1.7 var(--font-sans);color:var(--text-muted);text-wrap:pretty\">Fully rounded, 13.5px semibold, sentence case, verb-first. One <strong style=\"color:var(--text)\">primary<\u002Fstrong> per view — the thing the page exists to do (Create Agent, Save Agent, Run Tests). Everything else is outline or ghost.<\u002Fp>\n\n        <div style=\"margin-top:32px;border:1px solid var(--border);border-radius:16px;background:var(--surface);overflow:hidden\">\n          <div style=\"padding:16px 24px;border-bottom:1px solid var(--border);background:var(--surface-2);display:flex;justify-content:space-between;align-items:center\"><span style=\"font:700 10.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">Variants<\u002Fspan><span style=\"font:400 11.5px/1 var(--font-sans);color:var(--text-subtle)\">hover and press these — they are live<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:32px 24px;display:flex;flex-wrap:wrap;gap:14px;align-items:center\">\n            <button style=\"display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 20px;border:1px solid var(--primary);border-radius:999px;background:var(--primary);color:var(--primary-fg);font:600 13.5px/1 var(--font-sans);cursor:pointer;transition:background .12s ease-out,box-shadow .12s ease-out\" style-hover=\"background:var(--primary-hover);border-color:var(--primary-hover)\" style-active=\"background:var(--primary-active);border-color:var(--primary-active)\" style-focus=\"box-shadow:0 0 0 3px var(--ring);outline:none\"><span data-icon=\"true\" style=\"--u:url(&quot;d9bd7573-14a3-4b23-991f-5351616342ae&quot;);font-size:16px\"><\u002Fspan>Create agent<\u002Fbutton>\n            <button style=\"display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 20px;border:1px solid var(--primary);border-radius:999px;background:transparent;color:var(--primary);font:600 13.5px/1 var(--font-sans);cursor:pointer;transition:background .12s ease-out\" style-hover=\"background:var(--primary-soft)\" style-active=\"background:var(--primary-soft);border-color:var(--primary-active);color:var(--primary-active)\" style-focus=\"box-shadow:0 0 0 3px var(--ring);outline:none\"><span data-icon=\"true\" style=\"--u:url(&quot;16ba515b-6c31-429f-bf25-684b715a33f6&quot;);font-size:16px\"><\u002Fspan>Test<\u002Fbutton>\n            <button style=\"display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text-muted);font:600 13.5px/1 var(--font-sans);cursor:pointer;transition:all .12s ease-out\" style-hover=\"border-color:var(--border-strong);color:var(--text);background:var(--surface-2)\" style-focus=\"box-shadow:0 0 0 3px var(--ring);outline:none\"><span data-icon=\"true\" style=\"--u:url(&quot;c24442b0-7e86-4d4a-8e4b-d26bf6196dab&quot;);font-size:16px\"><\u002Fspan>Filter by tags<\u002Fbutton>\n            <button style=\"display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border:1px solid transparent;border-radius:999px;background:transparent;color:var(--text-muted);font:600 13.5px/1 var(--font-sans);cursor:pointer;transition:all .12s ease-out\" style-hover=\"background:var(--surface-2);color:var(--text)\" style-focus=\"box-shadow:0 0 0 3px var(--ring);outline:none\">Cancel<\u002Fbutton>\n            <button style=\"display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border:1px solid var(--danger);border-radius:999px;background:transparent;color:var(--danger);font:600 13.5px/1 var(--font-sans);cursor:pointer;transition:background .12s ease-out\" style-hover=\"background:var(--danger-soft)\" style-focus=\"box-shadow:0 0 0 3px rgba(192,57,43,.3);outline:none\"><span data-icon=\"true\" style=\"--u:url(&quot;444e91da-e364-4616-98dd-f871482cfd95&quot;);font-size:16px\"><\u002Fspan>Delete<\u002Fbutton>\n            <button style=\"display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 20px;border:1px solid var(--danger);border-radius:999px;background:var(--danger);color:#fff;font:600 13.5px/1 var(--font-sans);cursor:pointer;transition:filter .12s ease-out\" style-hover=\"filter:brightness(1.1)\" style-focus=\"box-shadow:0 0 0 3px rgba(192,57,43,.3);outline:none\">Delete permanently<\u002Fbutton>\n            <button style=\"display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text-muted);cursor:pointer;transition:all .12s ease-out\" style-hover v style=\"padding:18px 12px\"><span style=\"display:inline-flex;height:36px;align-items:center;padding:0 18px;border-radius:999px;background:var(--primary);color:var(--primary-fg);font:600 13px/1 var(--font-sans);box-shadow:0 0 0 3px var(--ring)\">Save agent<\u002Fspan><\u002Fdiv>\n                <div style=\"padding:18px 12px\"><span style=\"display:inline-flex;height:36px;align-items:center;padding:0 18px;border-radius:999px;background:var(--primary-active);color:var(--primary-fg);font:600 13px/1 var(--font-sans);transform:scale(.98)\">Save agent<\u002Fspan><\u002Fdiv>\n                <div style=\"padding:18px 12px\"><span style=\"display:inline-flex;height:36px;align-items:center;padding:0 18px;border-radius:999px;background:var(--primary);color:var(--primary-fg);font:600 13px/1 var(--font-sans);opacity:.4\">Save agent<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:120px repeat(5,1fr);border-bottom:1px solid var(--border);align-items:center\">\n                <div style=\"padding:18px 24px;font:600 12.5px/1.3 var(--font-sans);color:var(--text-muted)\">Outline<\u002Fdiv>\n                <div style=\"padding:18px 12px\"><span style=\"display:inline-flex;height:36px;align-items:center;padding:0 18px;border-radius:999px;border:1px solid var(--primary);color:var(--primary);font:600 13px/1 var(--font-sans)\">Test<\u002Fspan><\u002Fdiv>\n                <div style=\"padding:18px 12px\"><span style=\"display:inline-flex;height:36px;align-items:center;padding:0 18px;border-radius:999px;border:1px solid var(--primary);background:var(--primary-soft);color:var(--primary);font:600 13px/1 var(--font-sans)\">Test<\u002Fspan><\u002Fdiv>\n                <div style=\"padding:18px 12px\"><span style=\"display:inline-flex;height:36px;align-items:center;padding:0 18px;border-radius:999px;border:1px solid var(--primary);color:var(--primary);font:600 13px/1 var(--font-sans);box-shadow:0 0 0 3px var(--ring)\">Test<\u ustify-content:space-between;font:600 12.5px/1 var(--font-sans);color:var(--text)\"><span>Indexing documents<\u002Fspan><span style=\"font-family:var(--font-mono);color:var(--text-muted)\">62%<\u002Fspan><\u002Fdiv><div style=\"height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden\"><div style=\"width:62%;height:100%;background:var(--primary);border-radius:999px\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:8px\"><div style=\"display:flex;justify-content:space-between;font:600 12.5px/1 var(--font-sans);color:var(--text)\"><span>Test suite<\u002Fspan><span style=\"font-family:var(--font-mono);color:var(--success)\">4 / 4<\u002Fspan><\u002Fdiv><div style=\"height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden\"><div style=\"width:100%;height:100%;background:var(--success);border-radius:999px\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"width:20px;height:20px;border-radius:999px;border:2.5px solid var(--surface-3);border-top-color:var(--primary);animation:dsw-spin .7s linear infinite\"><\u002Fspan><span style=\"font:500 13px/1 var(--font-sans);color:var(--text-muted)\">Running inference…<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:22px;display:flex;flex-direction:column;gap:14px\">\n            <span style=\"font:700 10.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">Skeleton — entity card<\u002Fspan>\n            <div style=\"display:flex;gap:14px;align-items:center\"><div data-skel=\"true\" style=\"width:44px;height:44px;border-radius:11px;flex:none\"><\u002Fdiv><div style=\"flex:1;display:flex;flex-direction:column;gap:8px\"><div data-skel=\"true\" style=\"height:13px;width:62%;border-radius:5px;\"><\u002Fdiv><div data-skel=\"true\" style=\"height:11px;width:40%;border-radius:5px;\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div data-skel=\"true\" style=\"height:11px;width:100%;border-radius:5px;\"><\u002Fdiv>\n            <div data-skel=\"true\" style=\"height:11px;width:84%;border-radius:5px;\"><\u002Fdiv>\n            <div data-skel=\"true\" style=\"height:40px;width:100%;border-radius:10px;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:22px;display:flex;flex-direction:column;gap:14px\">\n            <span style=\"font:700 10.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">Tooltip — hover the dots<\u002Fspan>\n            <div style=\"display:flex;gap:26px;padding:26px 0;justify-content:center\">\n              <span data-tip=\"true\" style=\"display:inline-flex\"><span data-icon=\"true\" style=\"--u:url(&quot;5cb77447-595e-4b9c-94f0-150a28ceccff&quot;);font-size:20px;color:var(--text-muted);cursor:help\"><\u002Fspan><span data-tip-body=\"true\" style=\"position:absolute;bottom:calc(100% + 8px);left:50%;padding:7px 11px;border-radius:8px;background:var(--text);color:var(--bg);font:600 11.5px/1.4 var(--font-sans);white-space:nowrap;box-shadow:var(--sh-3);z-index:5\">Top K controls retrieved chunks<\u002Fspan><\u002Fspan>\n              <span data-tip=\"true\" style=\"display:inline-flex\"><span data-icon=\"true\" style=\"--u:url(&quot;444e91da-e364-4616-98dd-f871482cfd95&quot;);font-size:20px;color:var(--danger);cursor:pointer\"><\u002Fspan><span data-tip-body=\"true\" style=\"position:absolute;bottom:calc(100% + 8px);left:50%;padding:7px 11px;border-radius:8px;background:var(--text);color:var(--bg);font:600 11.5px/1.4 var(--font-sans);white-space:nowrap;box-shadow:var(--sh-3);z-index:5\">Delete version — irreversible<\u002Fspan><\u002Fspan>\n              <span data-tip=\"true\" style=\"display:inline-flex\"><span data-icon=\"true\" style=\"--u:url(&quot;e3a46b22-abab-45fe-af97-e178bd1d8298&quot;);font-size:20px;color:var(--text-muted);cursor:pointer\"><\u002Fspan><span data-tip-body=\"true\" style=\"position:absolute;bottom:calc(100% + 8px);left:50%;padding:7px 11px;border-radius:8px;background:var(--text);color:var(--bg);font:600 11.5px/1.4 var(--font-sans);white-space:nowrap;box-shadow:var(--sh-3);z-index:5\">Copy agent ID<\u002Fspan><\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin:0;font:400 12.5px/1.6 var(--font-sans);color:var(--text-subtle)\">Tooltips label, they never explain. Anything longer than six words belongs in help text or a popover.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3 style=\"margin:44px 0 16px;font:700 16px/1.3 var(--font-sans);letter-spacing:-.01em\">Accordion &amp; FAQ <span style=\"font:400 13px/1 var(--font-sans);color:var(--text-subtle)\">— open a few, they animate<\u002Fspan><\u002Fh3>\n        <p style=\"margin:0 0 18px;max-width:74ch;font:400 14px/1.7 var(--font-sans);color:var(--text-muted)\">An accordion is for reference content a reader scans and dips into — help, FAQs, advanced settings. It is never a substitute for a page. The panel animates its <em>height<\u002Fem>, not its opacity alone, so the list below visibly makes room; 300ms on <code style=\"font:500 13px var(--font-mono);color:var(--text)\">cubic-bezier(.4,0,.2,1)<\u002Fcode>, the same curve as tabs and drawers.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;align-items:start\">\n          <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden\">\n            <div style=\"padding:16px 22px;border-bottom:1px solid var(--border);background:var(--surface-2);display:flex;align-items:center;justify-content:space-between;gap:12px\">\n              <span style=\"font:700 10.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">Frequently asked<\u002Fspan>\n              <button sc-camel-on-click=\"{{ toggleAllFaq }}\" style=\"border:1px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:999px;padding:6px 13px;font:600 11.5px/1 var(--font-sans);cursor:pointer\" style-hover=\"border-color:var(--primary);color:var(--primary)\">{{ faqAllLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-for list=\"{{ faqs }}\" as=\"item\" hint-placeholder-count=\"6\">\n              <div style=\"border-bottom:1px solid var(--border)\">\n                <button data-acc-head=\"true\" aria-expanded=\"{{ item.open }}\" sc-camel-on-click=\"{{ item.toggle }}\" style=\"width:100%;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:16px 22px;border:none;background:transparent;color:var(--text);font:600 13.5px/1.45 var(--font-sans);cursor:pointer;text-align:left;transition:background .12s,color .12s\" style-hover=\"background:var(--surface-2)\">\n                  {{ item.q }}\n                  <span data-acc-chev=\"true\" data-icon=\"true\" style=\"--u:url(&quot;cb9d7016-19a7-4fa7-bfbe-4f5df5a42dd5&quot;);font-size:18px;color:var(--text-subtle);flex:none;margin-top:1px\"><\u002Fspan>\n                <\u002Fbutton>\n                <div data-acc=\"true\" data-open=\"{{ item.open }}\"><div><p style=\"margin:0;padding:0 22px 18px;font:400 13.5px/1.75 var(--font-sans);color:var(--text-muted);max-width:62ch\">{{ item.a }}<\u002Fp><\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <div style=\"border:1px solid var(--border);border-left:3px solid var(--success);border-radius:12px;background:var(--surface);padding:18px 20px\">\n              <strong style=\"display:flex;align-items:center;gap:8px;font:700 13px/1.3 var(--font-sans);color:var(--success)\"><span data-icon=\"true\" style=\"--u:url(&quot;24238716-c924-44a4-9e27-3718a8813fea&quot;)\"><\u002Fspan>Do<\u002Fstrong>\n              <ul style=\"margin:10px 0 0;padding-left:18px;font:400 13.5px/1.75 var(--font-sans);color:var(--text-muted)\"><li>Write the header as the question a user would type.<\u002Fli><li>Let several panels stay open at once for FAQs.<\u002Fli><li>Animate height so the page reflows visibly.<\u002Fli><li>Keep the chevron on the right; rotate it 180°.<\u002Fli><\u002Ful>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--border);border-left:3px solid var(--danger);border-radius:12px;background:var(--surface);padding:18px 20px\">\n              <strong style=\"display:flex;align-items:center;gap:8px;font:700 13px/1.3 var(--font-sans);color:var(--danger)\"><span data-icon=\"true\" style=\"--u:url(&quot;b1dafb6f-a46c-44ad-b000-f9e2dfb5a867&quot;)\"><\u002Fspan>Don't<\u002Fstrong>\n              <ul style=\"margin:10px 0 0;padding-left:18px;font:400 13.5px/1.75 var(--font-sans);color:var(--text-muted)\"><li>Hide anything required to complete a task.<\u002Fli><li>Nest an accordion inside an accordion.<\u002Fli><li>Animate with <code style=\"font:500 12px var(--font-mono)\">max-height<\u002Fcode> guesses — long answers snap.<\u002Fli><li>Collapse the panel a user is actively reading.<\u002Fli><\u002Ful>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div data-code=\"true\" style=\"margin-top:18px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);overflow:hidden\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 10px 9px 16px;border-bottom:1px solid var(--border)\"><span style=\"font:700 10.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">Accordion<\u002Fspan><button sc-camel-on-click=\"{{ copy }}\" style=\"border:1px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:7px;padding:5px 11px;font:600 11px/1 var(--font-sans);cursor:pointer\" style-hover=\"color:var(--primary);border-color:var(--primary)\">Copy<\u002Fbutton><\u002Fdiv>\n          <pre data-scroll=\"true\" style=\"margin:0;padding:16px;overflow:auto;font:400 12.5px/1.75 var(--font-mono);color:var(--text-muted)\">/* Height animates with no measured pixel value — any answer length works */\n.acc-panel { display: grid; grid-template-rows: 0fr; opacity: .4;\n             transition: grid-template-rows .3s cubic-bezier(.4,0,.2,1), opacity .22s; }\n.acc-panel[data-open=\"true\"] { grid-template-rows: 1fr; opacity: 1; }\n.acc-panel &gt; div { overflow: hidden; min-height: 0; }   /* required for 0fr to collapse */\n.acc-chevron { transition: transform .3s cubic-bezier(.4,0,.2,1); }\n[aria-expanded=\"true\"] .acc-chevron { transform: rotate(180deg); }\n@media (prefers-reduced-motion: reduce) { .acc-panel, .acc-chevron { transition: none } }\n\n&lt;button aria-expanded={open} aria-controls={id} sc-camel-on-click={() =&gt; setOpen(!open)}&gt;\n  {question}&lt;ChevronDown sc-camel-class-name=\"acc-chevron size-4\" aria-hidden /&gt;\n&lt;/button&gt;\n&lt;div id={id} role=\"region\" sc-camel-class-name=\"acc-panel\" data-open={open}&gt;\n  &lt;div&gt;&lt;p&gt;{answer}&lt;/p&gt;&lt;/div&gt;\n&lt;/div&gt;<\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"charts\" style=\"padding:72px 0 76px;border-bottom:1px solid var(--border)\">\n        <span style=\"font:700 11px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--primary)\">02.6 — Components<\u002Fspan>\n        <h2 style=\"margin:14px 0 0;font:800 34px/1.12 var(--font-sans);letter-spacing:-.025em\">Charts<\u002Fh2>\n        <p style=\"margin:14px 0 0;max-width:72ch;font:400 15.5px/1.7 var(--font-sans);color:var(--text-muted);text-wrap:pretty\">Monitoring is the densest surface in the product, so charts are deliberately plain: no gridline clutter, no 3D, no drop shadows. Axes are 11px mono in <code style=\"font:500 13px var(--font-mono);color:var(--text)\">--text-subtle<\u002Fcode>; only horizontal gridlines are drawn, at 1px.<\u002Fp>\n\n        <div style=\"margin-top:30px;border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:20px 22px;display:flex;flex-wrap:wrap;gap:22px;align-items:center\">\n          <span style=\"font:700 10.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">Series order<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:8px;font:500 12.5px/1 var(--font-sans);color:var(--text-muted)\"><span style=\"width:12px;height:12px;border-radius:3px;background:#F2740E\"><\u002Fspan>1 · #F2740E<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:8px;font:500 12.5px/1 var(--font-sans);color:var(--text-muted)\"><span style=\"width:12px;height:12px;border-radius:3px;background:#2334A1\"><\u002Fspan>2 · #2334A1<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:8px;font:500 12.5px/1 var(--font-sans);color:var(--text-muted)\"><span style=\"width:12px;height:12px;border-radius:3px;background:#5B4BE0\"><\u002Fspan>3 · #5B4BE0<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:8px;font:500 12.5px/1 var(--font-sans);color:var(--text-muted)\"><span style=\"width:12px;height:12px;border-radius:3px;background:#1B7A3D\"><\u002Fspan>4 · #1B7A3D<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:8px;font:500 12.5px/1 var(--font-sans);color:var(--text-muted)\"><span style=\"width:12px;height:12px;border-radius:3px;background:#C9870C\"><\u002Fspan>5 · #C9870C<\u002Fspan>\n          <span style=\"font:400 12px/1.5 var(--font-sans);color:var(--text-subtle);max-width:34ch\">Never reorder. A sixth series means the chart should be split.<\u002Fspan>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px ency.<\u002Fp>\n\n        <div style=\"margin-top:32px;border:1px solid var(--border);border-radius:16px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column;max-width:820px\">\n          <div style=\"display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border);background:var(--surface-2)\">\n            <div style=\"width:34px;height:34px;border-radius:9px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center\"><span data-icon=\"true\" style=\"--u:url(&quot;e38e0ec9-b25c-4769-99d6-7a1bab1aacfa&quot;);font-size:18px\"><\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:2px\"><strong style=\"font:700 13.5px/1.2 var(--font-sans)\">Policy Information Extractor<\u002Fstrong><span style=\"font:500 11.5px/1.2 var(--font-mono);color:var(--text-subtle)\">v3 · llama-3.3-70B-Instruct<\u002Fspan><\u002Fdiv>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <span style=\"display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:var(--success-soft);color:var(--success);font:600 11.5px/1 var(--font-sans)\"><span style=\"width:6px;height:6px;border-radius:999px;background:currentColor\"><\u002Fspan>Session active<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"padding:24px 20px;display:flex;flex-direction:column;gap:20px;min-height:280px\">\n            <div style=\"display:flex;justify-content:flex-end\"><div style=\"max-width:74%;padding:13px 17px;border-radius:16px 16px 4px 16px;background:var(--primary);color:var(--primary-fg);font:400 13.5px/1.6 var(--font-sans)\">Give me the benefits of DSW Policy Seva Life Insurance<\u002Fdiv><\u002Fdiv>\n\n            <div style=\"display:flex;gap:12px;align-items:flex-start\">\n              <div style=\"width:30px;height:30px;border-radius:9px;background:var(--navy-soft);color:var(--navy);display:grid;place-items:center;flex:none;margin-top:2px\"><span data-icon=\"true\" style=\"--u:url(&quot;e38e0ec9-b25c-4769-99d6-7a1bab1aacfa&quot;);font-size:16px\"><\u002Fspan><\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:10px;flex:1;min-width:0\">\n                <div style=\"display:{{ chatTypingDisplay }};align-items:center;gap:7px;padding:12px 16px;border:1px solid var(--border);border-radius:4px 16px 16px 16px;background:var(--surface-2);width:fit-content\"><span style=\"width:7px;height:7px;border-radius:999px;background:var(--text-subtle);animation:dsw-pulse 1.2s ease-in-out infinite\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:999px;background:var(--text-subtle);animation:dsw-pulse 1.2s ease-in-out .2s infinite\"><\u002Fspan><span style=\"width:7px;height:7px;border-radius:999px;background:var(--text-subtle);animation:dsw-pulse 1.2s ease-in-out .4s infinite\"><\u002Fspan><\u002Fdiv>\n                <div style=\"display:{{ chatReplyDisplay }};flex-direction:column;gap:12px;animation:dsw-in .24s cubic-bezier(.16,1,.3,1)\">\n                  <div style=\"padding:15px 18px;border:1px solid var(--border);border-radius:4px 16px 16px 16px;background:var(--surface-2);font:400 13.5px/1.7 var(--font-sans);color:var(--text)\">\n                    Policy Seva Life Insurance provides the following benefits:\n                    <ul style=\"margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px\"><li>Death benefit equal to the sum assured plus accrued bonuses<\u002Fli><li>Maturity benefit payable at the end of the policy term<\u002Fli><li>Tax relief under sections 80C and 10(10D)<\u002Fli><li>Optional riders for critical illness and accidental death<\u002Fli><\u002Ful>\n                    <span style=\"display:block;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font:400 12px/1.5 var(--font-sans);color:var(--text-subtle)\">Source: policy-seva-life-2026.pdf · pages 4–6<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:10px\">\n                    <span style=\"display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--success-soft);color:var(--success);font:600 11.5px/1.4 var(--font-sans)\"><span data-icon=\"true\" style=\"--u:url(&quot;31490a90-1b60-4c12-b892-e18146f45800&quot;);font-size:13px\"><\u002Fspan>Guardrails clear<\u002Fspan>\n                    <span style=\"font:500 11.5px/1 var(--font-mono);color:var(--text-subtle)\">812 in · 246 out<\u002Fspan>\n                    <span style=\"font:500 11.5px/1 var(--font-mono);color:var(--text-subtle)\">840 ms<\u002Fspan>\n                    <div style=\"flex:1\"><\u002Fdiv>\n                    <div style=\"display:flex;gap:12px;color:var(--text-subtle)\"><span data-icon=\"true\" style=\"--u:url(&quot;e3a46b22-abab-45fe-af97-e178bd1d8298&quot;);font-size:16px;cursor:pointer\"><\u002Fspan><span data-icon=\"true\" style=\"--u:url(&quot;f1593443-fe8e-41d2-b417-9295e06d5df3&quot;);font-size:16px;cursor:pointer\"><\u002Fspan><span data-icon=\"true\" style=\"--u:url(&quot;b6cc19e3-2281-437c-b33a-36e1684a2f5f&quot;);font-size:16px;cursor:pointer\"><\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;gap:12px;align-items:flex-start\">\n              <div style=\"width:30px;height:30px;border-radius:9px;background:var(--danger-soft);color:var(--danger);display:grid;place-items:center;flex:none;margin-top:2px\"><span data-icon=\"true\" style=\"--u:url(&quot;2b02dccc-6741-495a-a3b3-38bbd4b6f686&quot;);font-size:16px\"><\u002Fspan><\u002Fdiv>\n              <div style=\"padding:14px 18px;border:1px solid var(--danger);border-radius:4px 16px 16px 16px;background:var(--danger-soft);font:400 13.5px/1.65 var(--font-sans);color:var(--text);max-width:74%\"><strong style=\"display:block;font:700 13px/1.4 var(--font-sans);color:var(--danger);margin-bottom:4px\">Response blocked post-inference<\u002Fstrong>The output matched the Competitor Check guardrail and was suppressed before delivery. Rephrase the question or review the output guard suite.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:16px 20px;border-top:1px solid var(--border);background:var(--surface-2);display:flex;flex-direction:column;gap:10px\">\n            <div style=\"display:flex;gap:10px;align-items:flex-end\">\n              <div style=\"flex:1;display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid var(--border);border-radius:14px;background:var(--surface);min-height:46px\">\n                <span data-icon=\"true\" style=\"--u:url(&quot;fabc22a5-5891-4d14-b836-b4862799b0a9&quot;);font-size:17px;color:var(--text-subtle);cursor:pointer\"><\u002Fspan>\n                <input type=\"text\" placeholder=\"Ask your agent a question…\" style=\"flex:1;border:none;background:transparent;color:var(--text);font:400 13.5px/1 var(--font-sans);outline:none;height:44px\">\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ sendChat }}\" aria-label=\"Send message\" style=\"display:grid;place-items:center;width:46px;height:46px;border:1px solid var(--primary);border-radius:14px;background:var(--primary);color:var(--primary-fg);cursor:pointer;flex:none\" style-hover=\"background:var(--primary-hover)\"><span data-icon=\"true\" style=\"--u:url(&quot;dd14d05d-e4ff-415e-9cf6-3170b44f0e8f&quot;);font-size:19px\"><\u002Fspan><\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:12px\"><span style=\"font:400 11.5px/1.4 var(--font-sans);color:var(--text-subtle)\">Enter to send · Shift + Enter for a new line<\u002Fspan><div style=\"flex:1\"><\u002Fdiv><button sc-camel-on-click=\"{{ resetChat }}\" style=\"border:none;background:transparent;color:var(--text-subtle);font:600 11.5px/1 var(--font-sans);cursor:pointer;te
