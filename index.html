  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

lor:var(--text)\">Forms &amp; inputs<\u002Fa>\n      <a data-nav=\"cards\" href=\"#cards\" style=\"padding:8px 12px;border-radius:8px;font:500 13px/1.2 var(--font-sans);color:var(--text-muted)\" style-hover=\"background:var(--surface-2);color:var(--text)\">Cards<\u002Fa>\n      <a data-nav=\"navigation\" href=\"#navigation\" style=\"padding:8px 12px;border-radius:8px;font:500 13px/1.2 var(--font-sans);color:var(--text-muted)\" style-hover=\"background:var(--surface-2);color:var(--text)\">Navigation<\u002Fa>\n      <a data-nav=\"data\" href=\"#data\" style=\"padding:8px 12px;border-radius:8px;font:500 13px/1.2 var(--font-sans);color:var(--text-muted)\" style-hover=\"background:var(--surface-2);color:var(--text)\">Data display<\u002Fa>\n      <a data-nav=\"feedback\" href=\"#feedback\" style=\"padding:8px 12px;border-radius:8px;font:500 13px/1.2 var(--font-sans);color:var(--text-muted)\" style-hover=\"background:var(--surface-2);color:var(--text)\">Feedback &amp; overlays<\u002Fa>\n      <a data-nav=\"charts\" href=\"#charts\" style=\"padding:8px 12px;border-radius:8px;font:500 13px/1.2 var(--font-sans);color:var(--text-muted)\" style-hover=\"background:var(--surface-2);color:var(--text)\">Charts<\u002Fa>\n      <a data-nav=\"chat\" href=\"#chat\" style=\"padding:8px 12px;border-radius:8px;font:500 13px/1.2 var(--font-sans);color:var(--text-muted)\" style-hover=\"background:var(--surface-2);color:var(--text)\">Chat &amp; inference<\u002Fa>\n\n      <span style=\"font:700 10px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle);padding:16px 12px 6px\">Applied<\u002Fspan>\n      <a data-nav=\"patterns\" href=\"#patterns\" style=\"padding:8px 12px;border-radius:8px;font:500 13px/1.2 var(--font-sans);color:var(--text-muted)\" style-hover=\"background:var(--surface-2);color:var(--text)\">Patterns<\u002Fa>\n      <a data-nav=\"a11y\" href=\"#a11y\" style=\"padding:8px 12px;border-radius:8px;font:500 13px/1.2 var(--font-sans);color:var(--text-muted)\" style-hover=\"background:var(--surface-2);color:var(--text)\">Accessibility<\u002Fa>\n      \n      <a data-nav=\"voice\" href=\"#voice\" style=\"padding:8px 12px;border-radius:8px;font:500 13px/1.2 var(--font-sans);color:var(--text-muted)\" style-hover=\"background:var(--surface-2);color:var(--text)\">Voice &amp; content<\u002Fa>\n    <\u002Fnav>\n  <\u002Faside>\n\n  <main style=\"min-width:0;padding:0 0 120px\">\n\n    <header style=\"padding:64px 56px 44px;border-bottom:1px solid var(--border);background:var(--surface)\">\n      <div style=\"max-width:1080px;display:flex;flex-direction:column;gap:18px\">\n        <span style=\"font:700 11px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--primary)\">Data Science Wizards · Enterprise AI Operating System<\u002Fspan>\n        <h1 style=\"margin:0;font:800 46px/1.06 var(--font-sans);letter-spacing:-.03em;color:var(--text);max-width:20ch;text-wrap:balance\">The UnifyAI OS Design System<\u002Fh1>\n        <p style=\"margin:0;max-width:68ch;font:400 17px/1.65 var(--font-sans);color:var(--text-muted);text-wrap:pretty\">Every interface primitive, state and pattern used across AI Agent Studio, Data Engineering, Feature Store and AI Studio — specified once, in light and dark, with copyable markup. Built for partner and white-label teams shipping on UnifyAI OS.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:6px\">\n          <span style=\"display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:var(--primary-soft);color:var(--primary-soft-fg);font:600 12px/1 var(--font-sans)\"><span data-icon=\"true\" style=\"--u:url(&quot;286b7d9a-f498-4a10-aa3f-574e1ba15c73&quot;)\"><\u002Fspan>Light &amp; dark<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:var(--navy-soft);color:var(--navy);font:600 12px/1 var(--font-sans)\"><span data-icon=\"true\" style=\"--u:url(&quot;370bdaa8-96d6-46ec-bfd6-148e57ebe431&quot;)\"><\u002Fspan>React + Tailwind + shadcn/ui<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font:600 12px/1 var(--font-sans)\"><span data-icon=\"true\" style=\"--u:url(&quot;73963703-fb69-4896-b1c0-6bc2784075a8&quot;)\"><\u002Fspan>WCAG 2.2 AA<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <div style=\"padding:0 56px;max-width:1240px\">\n      <section id=\"product\" style=\"padding:72px 0 76px;border-bottom:1px solid var(--border)\">\n        <span style=\"font:700 11px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--primary)\">00 — Foundations<\u002Fspan>\n        <h2 style=\"margin:14px 0 0;font:800 34px/1.12 var(--font-sans);letter-spacing:-.025em\">Product &amp; platform<\u002Fh2>\n        <p style=\"margin:14px 0 0;max-width:74ch;font:400 15.5px/1.7 var(--font-sans);color:var(--text-muted);text-wrap:pretty\"><strong style=\"color: var(--text);\">UnifyAI OS<\u002Fstrong>&nbsp;- an Enterprise AI Operating System for building, integrating, deploying, governing, monitoring and operating AI and Agentic AI as one unified enterprise system. It runs on-premises, in private or public cloud, and hybrid, while the enterprise keeps governance, ownership and operational control. Every interface decision in this system exists to make that promise legible on screen.<\u002Fp>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:32px\">\n          <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"width:38px;height:38px;border-radius:11px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center\"><span data-icon=\"true\" style=\"--u:url(&quot;b9d7eebd-9752-4048-bad0-af51f68ec17f&quot;);font-size:20px\"><\u002Fspan><\u002Fdiv>\n            <h3 style=\"margin:0;font:700 15px/1.35 var(--font-sans)\">One subscription, unlimited use cases<\u002Fh3>\n            <p style=\"margin:0;font:400 13.5px/1.65 var(--font-sans);color:var(--text-muted)\">Build and operate unlimited AI and Agentic AI use cases on one governed foundation.<\u002Fp>\n            <p style=\"margin:6px 0 0;padding-top:12px;border-top:1px solid var(--border);font:500 12.5px/1.6 var(--font-sans);color:var(--text-subtle)\"><strong style=\"color:var(--primary)\">In the UI —<\u002Fstrong> modules share one sidebar, one card grammar and one detail layout, so a new use case never feels like a new product.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"width:38px;height:38px;border-radius:11px;background:var(--navy-soft);color:var(--navy);display:grid;place-items:center\"><span data-icon=\"true\" style=\"--u:url(&quot;c3e9af07-3e44-4757-9669-eb1bf554390d&quot;);font-size:20px\"><\u002Fspan><\u002Fdiv>\n            <h3 style=\"margin:0;font:700 15px/1.35 var(--font-sans)\">Ownership, no lock-in<\u002Fh3>\n            <p style=\"margin:0;font:400 13.5px/1.65 var(--font-sans);color:var(--text-muted)\">Customers keep their data and AI assets and deploy anywhere — on-prem, cloud or hybrid.<\u002Fp>\n            <p style=\"margin:6px 0 0;padding-top:12px;border-top:1px solid var(--border);font:500 12.5px/1.6 var(--font-sans);color:var(--text-subtle)\"><strong style=\"color:var(--primary)\">In the UI —<\u002Fstrong> every object exposes its ID, version and export path. Deployment target is stated on the object, never assumed.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:12px\">\n            <div style=\"width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center\"><span data-icon=\"true\" style=\"--u:url(&quot;31490a90-1b60-4c12-b892-e18146f45800&quot;);font-size:20px\"><\u002Fspan><\u002Fdiv>\n            <h3 style=\"margin:0;font:700 15px/1.35 var(--font-sans)\">Governance built in<\u002Fh3>\n            <p style=\"margin:0;font:400 13.5px/1.65 var(--font-sans);color:var(--text-muted)\">Security, auditability, policy enforcement and lifecycle management ship with the platform.<\u002Fp>\n            <p style=\"margin:6px 0 0;padding-top:12px;border-top:1px solid var(--border);font:500 12.5px/1.6 var(--font-sans);color:var(--text-subtle)\"><strong style=\"color:var(--primary)\">In the UI —<\u002Fstrong> guardrail verdict, version and owner are never hidden behind a menu. A production object always shows its policy state.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3 style=\"margin:44px 0 16px;font:700 16px/1.3 var(--font-sans);letter-spacing:-.01em\">Deployment badges<\u002Fh3>\n        <p style=\"margin:0 0 18px;max-width:72ch;font:400 14px/1.7 var(--font-sans);color:var(--text-muted)\">Because UnifyAI OS runs in four environments, every deployable object carries its target as a neutral badge. These are informational, never brand orange.<\u002Fp>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px\">\n          <span style=\"display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text-muted);font:600 12px/1 var(--font-sans)\"><span data-icon=\"true\" style=\"--u:url(&quot;fd264540-cd63-41d3-a9d7-082e0cdd398a&quot;)\"><\u002Fspan>On-premises<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text-muted);font:600 12px/1 var(--font-sans)\"><span data-icon=\"true\" style=\"--u:url(&quot;7dd13258-5e76-4348-bca3-61ff0f558bf7&quot;)\"><\u002Fspan>Private cloud<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text-muted);font:600 12px/1 var(--font-sans)\"><span data-icon=\"true\" style=\"--u:url(&quot;132a3490-b305-4e27-82b0-0e5f620bfcfe&quot;)\"><\u002Fspan>Public cloud<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid var(--border);border-radius:999px;background:var(--surface);color:var(--text-muted);font:600 12px/1 var(--font-sans)\"><span data-icon=\"true\" style=\"--u:url(&quot;76a3f7d3-3506-4258-bfdf-cb2ea6aed404&quot;)\"><\u002Fspan>Hybrid<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border:1px solid var(--success);border-radius:999px;background:var(--success-soft);color:var(--success);font:600 12px/1 var(--font-sans)\"><span data-icon=\"true\" style=\"--u:url(&quot;ac6dddab-1aee-41f6-b0eb-7c90c928fc9d&quot;)\"><\u002Fspan>Governed<\u002Fspan>\n        <\u002Fdiv>\n\n        <h3 style=\"margin:44px 0 16px;font:700 16px/1.3 var(--font-sans);letter-spacing:-.01em\">Naming<\u002Fh3>\n        <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden\">\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:0;border-bottom:1px solid var(--border);padding:13px 20px;background:var(--surface-2)\"><span style=\"font:700 10.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">Write it as<\u002Fspan><span style=\"font:700 10.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">Not<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);padding:13px 20px;border-bottom:1px solid var(--border);font:500 13.5px/1.5 var(--font-sans)\"><span>UnifyAI OS<\u002Fspan><span style=\"color:var(--text-subtle)\">Unify AI, UnifyAI-OS, unifyai<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);padding:13px 20px;border-bottom:1px solid var(--border);font:500 13.5px/1.5 var(--font-sans)\"><span>Data Science Wizards (DSW)<\u002Fspan><span style=\"color:var(--text-subtle)\">DSW Inc., Datascience Wizards<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);padding:13px 20px;border-bottom:1px solid var(--border);font:500 13.5px/1.5 var(--font-sans)\"><span>Agent Studio, AI Studio, Feature Store<\u002Fspan><span style=\"color:var(--text-subtle)\">agent studio, AI-Studio<\u002Fspan><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);padding:13px 20px;font:500 13.5px/1.5 var(--font-sans)\"><span>Agentic AI<\u002Fspan><span style=\"color:var(--text-subtle)\">agentic-AI, Agentic-AI<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"overview\" style=\"padding:72px 0 76px;border-bottom:1px solid var(--border)\">\n        <span style=\"font:700 11px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--primary)\">01 — Foundations<\u002Fspan>\n        <h2 style=\"margin:14px 0 0;font:800 34px/1.12 var(--font-sans);letter-spacing:-.025em\">Overview<\u002Fh2>\n        <p style=\"margin:14px 0 0;max-width:72ch;font:400 15.5px/1.7 var(--font-sans);color:var(--text-muted);text-wrap:pretty\">UnifyAI OS is a dense, operational product. People spend hours in it configuring agents, reading logs and comparing versions. The system is therefore quiet by default: one accent colour, generous white space, no decorative gradients, and typography that stays legible at 13px. Colour is reserved for meaning — action, status, and selection.<\u002Fp>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:36px\">\n          <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:22px;display:flex;flex-direction:column;gap:10px\">\n            <span data-icon=\"true\" style=\"--u:url(&quot;eb7b3a15-d36f-4572-b156-b06bf82d1b6e&quot;);font-size:20px;color:var(--primary)\"><\u002Fspan>\n            <h3 style=\"margin:0;font:700 15px/1.3 var(--font-sans)\">One accent, used sparingly<\u002Fh3>\n            <p style=\"margin:0;font:400 13.5px/1.65 var(--font-sans);color:var(--text-muted)\">DSW orange marks the primary action and the current location. At most one orange button per view. Everything else is neutral.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:22px;display:flex;flex-direction:column;gap:10px\">\n            <span data-icon=\"true\" style=\"--u:url(&quot;55121da9-7e3a-4546-ae99-37429646c51c&quot;);font-size:20px;color:var(--navy)\"><\u002Fspan>\n            <h3 style=\"margin:0;font:700 15px/1.3 var(--font-sans)\">Cards over chrome<\u002Fh3>\n            <p style=\"margin:0;font:400 13.5px/1.65 var(--font-sans);color:var(--text-muted)\">Content sits in hairline-bordered cards on a soft page background. Shadows appear on interaction, not at rest.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:22px;display:flex;flex-direction:column;gap:10px\">\n            <span data-icon=\"true\" style=\"--u:url(&quot;31490a90-1b60-4c12-b892-e18146f45800&quot;);font-size:20px;color:var(--success)\"><\u002Fspan>\n            <h3 style=\"margin:0;font:700 15px/1.3 var(--font-sans)\">Status is never brand<\u002Fh3>\n            <p style=\"margin:0;font:400 13.5px/1.65 var(--font-sans);color:var(--text-muted)\">Red, amber and green mean risk, caution and clear. They are held separate from orange and navy so a reader never confuses brand with warning.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:22px;display:flex;flex-direction:column;gap:10px\">\n            <span data-icon=\"true\" style=\"--u:url(&quot;63d8f4b6-57cd-4073-bbd7-4908a23ef5de&quot;);font-size:20px;color:var(--accent)\"><\u002Fspan>\n            <h3 style=\"margin:0;font:700 15px/1.3 var(--font-sans)\">Everything reachable<\u002Fh3>\n            <p style=\"margin:0;font:400 13.5px/1.65 var(--font-sans);color:var(--text-muted)\">Every control is keyboard operable with a visible 2px focus ring. Hover-only actions always have a persistent equivalent.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:32px;border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:12px;background:var(--surface);padding:20px 22px;display:flex;gap:14px;align-items:flex-start\">\n          <span data-icon=\"true\" style=\"--u:url(&quot;574a8ec5-fc68-46e8-8dac-9781a2a0b552&quot;);font-size:18px;color:var(--primary);margin-top:2px\"><\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <strong style=\"font:700 13.5px/1.4 var(--font-sans)\">How to use this guide<\u002Fstrong>\n            <p style=\"margin:0;font:400 13.5px/1.7 var(--font-sans);color:var(--text-muted);max-width:80ch\">Tokens are the contract. Build with the CSS custom properties and Tailwind aliases below — never hard-code a hex value in a component. Every specimen on this page renders from those same tokens, so switching the theme toggle in the sidebar is a live audit of your own work.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"color\" style=\"padding:72px 0 76px;border-bottom:1px solid var(--border)\">\n        <span style=\"font:700 11px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--primary)\">01.1 — Foundations<\u002Fspan>\n        <h2 style=\"margin:14px 0 0;font:800 34px/1.12 var(--font-sans);letter-spacing:-.025em\">Colour &amp; theming<\u002Fh2>\n        <p style=\"margin:14px 0 0;max-width:72ch;font:400 15.5px/1.7 var(--font-sans);color:var(--text-muted);text-wrap:pretty\">Two brand colours, one accent, four status colours, one neutral ramp. DSW orange is the interactive colour — it is what you click. DSW navy is the institutional colour — headers, dark surfaces, print. Violet is a supporting accent for selected and AI-generated states only.<\u002Fp>\n\n        <h3 style=\"margin:40px 0 16px;font:700 16px/1.3 var(--font-sans);letter-spacing:-.01em\">Brand ramps<\u002Fh3>\n        <div style=\"display:grid;gap:22px\">\n          <div>\n            <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:10px\">\n              <strong style=\"font:700 13px/1 var(--font-sans)\">DSW Orange<\u002Fstrong>\n              <span style=\"font:500 12px/1 var(--font-mono);color:var(--text-subtle)\">--primary · 500 = #F2740E<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(10,1fr);border-radius:12px;overflow:hidden;border:1px solid var(--border)\">\n              <div style=\"background:#FFF4EA;padding:20px 10px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#7C3604\">50<\u002Fspan><span style=\"font:500 9.5px/1 var(--font-mono);color:#A84A05\">FFF4EA<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#FFE4CC;padding:20px 10px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#7C3604\">100<\u002Fspan><span style=\"font:500 9.5px/1 var(--font-mono);color:#A84A05\">FFE4CC<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#FDC79A;padding:20px 10px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#7C3604\">200<\u002Fspan><span style=\"font:500 9.5px/1 var(--font-mono);color:#7C3604\">FDC79A<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#FAA764;padding:20px 10px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#4F2202\">300<\u002Fspan><span style=\"font:500 9.5px/1 var(--font-mono);color:#4F2202\">FAA764<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#F78C36;padding:20px 10px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#4F2202\">400<\u002Fspan><span style=\"font:500 9.5px/1 var(--font-mono);color:#4F2202\">F78C36<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#F2740E;padding:20px 10px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#fff\">500<\u002Fspan><span style=\"font:500 9.5px/1 var(--font-mono);color:rgba(255,255,255,.85)\">F2740E<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#D35F06;padding:20px 10px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#fff\">600<\u002Fspan><span style=\"font:500 9.5px/1 var(--font-mono);color:rgba(255,255,255,.85)\">D35F06<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#A84A05;padding:20px 10px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#fff\">700<\u002Fspan><span style=\"font:500 9.5px/1 var(--font-mono);color:rgba(255,255,255,.85)\">A84A05<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#7C3604;padding:20px 10px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#fff\">800<\u002Fspan><span style=\"font:500 9.5px/1 var(--font-mono);color:rgba(2 ">7F8FD6<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#4A5CBF;padding:20px 10px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#fff\">400<\u002Fspan><span style=\"font:500 9.5px/1 var(--font-mono);color:rgba(255,255,255,.85)\">4A5CBF<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#2334A1;padding:20px 10px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#fff\">500<\u002Fspan><span style=\"font:500 9.5px/1 var(--font-mono);color:rgba(255,255,255,.85)\">2334A1<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#091F7C;padding:20px 10px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#fff\">600<\u002Fspan><span style=\"font:500 9.5px/1 var(--font-mono);color:rgba(255,255,255,.85)\">091F7C<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#071862;padding:20px 10px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#fff\">700<\u002Fspan><span style=\"font:500 9.5px/1 var(--font-mono);color:rgba(255,255,255,.85)\">071862<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#051147;padding:20px 10px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#fff\">800<\u002Fspan><span style=\"font:500 9.5px/1 var(--font-mono);color:rgba(255,255,255,.85)\">051147<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#030B2E;padding:20px 10px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#fff\">900<\u002Fspan><span style=\"font:500 9.5px/1 var(--font-mono);color:rgba(255,255,255,.85)\">030B2E<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"display:flex;align-items:baseline;gap:10px;margin-bottom:10px\">\n              <strong style=\"font:700 13px/1 var(--font-sans)\">Neutrals<\u002Fstrong>\n              <span style=\"font:500 12px/1 var(--font-mono);color:var(--text-subtle)\">warm grey — surfaces, borders, body text<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(11,1fr);border-radius:12px;overflow:hidden;border:1px solid var(--border)\">\n              <div style=\"background:#FFFFFF;padding:20px 8px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#1A1917\">0<\u002Fspan><span style=\"font:500 9px/1 var(--font-mono);color:#7C7873\">FFFFFF<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#FBFAF9;padding:20px 8px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#1A1917\">25<\u002Fspan><span style=\"font:500 9px/1 var(--font-mono);color:#7C7873\">FBFAF9<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#F6F5F4;padding:20px 8px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#1A1917\">50<\u002Fspan><span style=\"font:500 9px/1 var(--font-mono);color:#7C7873\">F6F5F4<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#EDECEA;padding:20px 8px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#1A1917\">100<\u002Fspan><span style=\"font:500 9px/1 var(--font-mono);color:#5C5854\">EDECEA<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#DEDCD9;padding:20px 8px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#1A1917\">200<\u002Fspan><span style=\"font:500 9px/1 var(--font-mono);color:#5C5854\">DEDCD9<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#C6C3BF;padding:20px 8px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#1A1917\">300<\u002Fspan><span style=\"font:500 9px/1 var(--font-mono);color:#423F3C\">C6C3BF<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#A29E99;padding:20px 8px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#1A1917\">400<\u002Fspan><span style=\"font:500 9px/1 var(--font-mono);color:#2A2826\">A29E99<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#7C7873;padding:20px 8px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#fff\">500<\u002Fspan><span style=\"font:500 9px/1 var(--font-mono);color:rgba(255,255,255,.85)\">7C7873<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#5C5854;padding:20px 8px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#fff\">600<\u002Fspan><span style=\"font:500 9px/1 var(--font-mono);color:rgba(255,255,255,.85)\">5C5854<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#2A2826;padding:20px 8px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#fff\">800<\u002Fspan><span style=\"font:500 9px/1 var(--font-mono);color:rgba(255,255,255,.85)\">2A2826<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#1A1917;padding:20px 8px 12px;display:flex;flex-direction:column;gap:4px\"><span style=\"font:700 10px/1 var(--font-mono);color:#fff\">900<\u002Fspan><span style=\"font:500 9px/1 var(--font-mono);color:rgba(255,255,255,.85)\">1A1917<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3 style=\"margin:44px 0 16px;font:700 16px/1.3 var(--font-sans);letter-spacing:-.01em\">Status &amp; accent<\u002Fh3>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px\">\n          <div style=\"border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)\">\n            <div style=\"height:58px;background:var(--success)\"><\u002Fdiv>\n            <div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:4px\"><strong style=\"font:700 13px/1.3 var(--font-sans)\">Success / Clear<\u002Fstrong><span style=\"font:500 11.5px/1.4 var(--font-mono);color:var(--text-subtle)\">--success · #1B7A3D<\u002Fspan><span style=\"font:400 12px/1.5 var(--font-sans);color:var(--text-muted)\">Agent healthy, test passed, guardrail clear.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)\">\n            <div style=\"height:58px;background:var(--warning)\"><\u002Fdiv>\n            <div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:4px\"><strong style=\"font:700 13px/1.3 var(--font-sans)\">Warning / Caution<\u002Fstrong><span style=\"font:500 11.5px/1.4 var(--font-mono);color:var(--text-subtle)\">--warning · #C9870C<\u002Fspan><span style=\"font:400 12px/1.5 var(--font-sans);color:var(--text-muted)\">Verify before proceeding. Never blocking.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)\">\n            <div style=\"height:58px;background:var(--danger)\"><\u002Fdiv>\n            <div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:4px\"><strong style=\"font:700 13px/1.3 var(--font-sans)\">Danger / Blocked<\u002Fstrong><span style=\"font:500 11.5px/1.4 var(--font-mono);color:var(--text-subtle)\">--danger · #C0392B<\u002Fspan><span style=\"font:400 12px/1.5 var(--font-sans);color:var(--text-muted)\">Guardrail block, failed test, destructive action.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)\">\n            <div style=\"height:58px;background:var(--accent)\"><\u002Fdiv>\n            <div style=\"padding:14px 16px;display:flex;flex-direction:column;gap:4px\"><strong style=\"font:700 13px/1.3 var(--font-sans)\">Accent / AI<\u002Fstrong><span style=\"font:500 11.5px/1.4 var(--font-mono);color:var(--text-subtle)\">--accent · #5B4BE0<\u002Fspan><span style=\"font:400 12px/1.5 var(--font-sans);color:var(--text-muted)\">Generated content, selected card, model output.<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3 style=\"margin:44px 0 16px;font:700 16px/1.3 var(--font-sans);letter-spacing:-.01em\">Semantic tokens<\u002Fh3>\n        <p style=\"margin:0 0 18px;max-width:72ch;font:400 14px/1.7 var(--font-sans);color:var(--text-muted)\">Components reference these, never the ramps. Each has a light and a dark value; the pair is the only thing a white-label partner needs to re-skin.<\u002Fp>\n        <div style=\"border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface)\">\n          <div data-thead=\"true\" style=\"display:grid;grid-template-columns:1.1fr 1fr 1fr 1.6fr;gap:0;font:700 11.5px/1 var(--font-sans);letter-spacing:.06em;text-transform:uppercase\">\n            <div style=\"padding:13px 18px\">Token<\u002Fdiv><div style=\"padding:13px 14px\">Light<\u002Fdiv><div style=\"padding:13px 14px\">Dark<\u002Fdiv><div style=\"padding:13px 18px\">Used for<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.1fr 1fr 1fr 1.6fr;border-top:1px solid var(--border);font:500 12.5px/1.5 var(--font-mono);color:var(--text)\"><div style=\"padding:12px 18px;background:var(--surface-2)\">--bg<\u002Fdiv><div style=\"padding:12px 14px;display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:14px;border-radius:4px;background:#F8F7F6;border:1px solid var(--border-strong)\"><\u002Fspan>#F8F7F6<\u002Fdiv><div style=\"padding:12px 14px;display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:14px;border-radius:4px;background:#0A0C16;border:1px solid var(--border-strong)\"><\u002Fspan>#0A0C16<\u002Fdiv><div style=\"padding:12px 18px;font:400 12.5px/1.5 var(--font-sans);color:var(--text-muted)\">Page canvas behind all cards<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.1fr 1fr 1fr 1.6fr;border-top:1px solid var(--border);font:500 12.5px/1.5 var(--font-mono);color:var(--text)\"><div style=\"padding:12px 18px;background:var(--surface-2)\">--surface<\u002Fdiv><div style=\"padding:12px 14px;display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:14px;border-radius:4px;background:#FFFFFF;border:1px solid var(--border-strong)\"><\u002Fspan>#FFFFFF<\u002Fdiv><div style=\"padding:12px 14px;display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:14px;border-radius:4px;background:#111426;border:1px solid var(--border-strong)\"><\u002Fspan>#111426<\u002Fdiv><div style=\"padding:12px 18px;font:400 12.5px/1.5 var(--font-sans);color:var(--text-muted)\">Cards, sidebar, modals, table body<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.1fr 1fr 1fr 1.6fr;border-top:1px solid var(--border);font:500 12.5px/1.5 var(--font-mono);color:var(--text)\"><div style=\"padding:12px 18px;background:var(--surface-2)\">--surface-2<\u002Fdiv><div style=\"padding:12px 14px;display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:14px;border-radius:4px;background:#F2F1EF;border:1px solid var(--border-strong)\"><\u002Fspan>#F2F1EF<\u002Fdiv><div style=\"padding:12px 14px;display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:14px;border-radius:4px;background:#171B30;border:1px solid var(--border-strong)\"><\u002Fspan>#171B30<\u002Fdiv><div style=\"padding:12px 18px;font:400 12.5px/1.5 var(--font-sans);color:var(--text-muted)\">Tab tracks, code blocks, inset panels<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.1fr 1fr 1fr 1.6fr;border-top:1px solid var(--border);font:500 12.5px/1.5 var(--font-mono);color:var(--text)\"><div style=\"padding:12px 18px;background:var(--surface-2)\">--border<\u002Fdiv><div style=\"padding:12px 14px;display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:14px;border-radius:4px;background:#E4E2DF;border:1px solid var(--border-strong)\"><\u002Fspan>#E4E2DF<\u002Fdiv><div style=\"padding:12px 14px;display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:14px;border-radius:4px;background:#262B45;border:1px solid var(--border-strong)\"><\u002Fspan>#262B45<\u002Fdiv><div style=\"padding:12px 18px;font:400 12.5px/1.5 var(--font-sans);color:var(--text-muted)\">Hairlines, card outlines, dividers<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.1fr 1fr 1fr 1.6fr;border-top:1px solid var(--border);font:500 12.5px/1.5 var(--font-mono);color:var(--text)\"><div style=\"padding:12px 18px;background:var(--surface-2)\">--text<\u002Fdiv><div style=\"padding:12px 14px;display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:14px;border-radius:4px;background:#1A1917;border:1px solid var(--border-strong)\"><\u002Fspan>#1A1917<\u002Fdiv><div style=\"padding:12px 14px;display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:14px;border-radius:4px;background:#F2F3F8;border:1px solid var(--border-strong)\"><\u002Fspan>#F2F3F8<\u002Fdiv><div style=\"padding:12px 18px;font:400 12.5px/1.5 var(--font-sans);color:var(--text-muted)\">Headings, values, primary body copy<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.1fr 1fr 1fr 1.6fr;border-top:1px solid var(--border);font:500 12.5px/1.5 var(--font-mono);color:var(--text)\"><div style=\"padding:12px 18px;background:var(--surface-2)\">--text-muted<\u002Fdiv><div style=\"padding:12px 14px;display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:14px;border-radius:4px;background:#5C5854;border:1px solid var(--border-strong)\"><\u002Fspan>#5C5854<\u002Fdiv><div style=\"padding:12px 14px;display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:14px;border-radius:4px;background:#A3A9C2;border:1px solid var(--border-strong)\"><\u002Fspan>#A3A9C2<\u002Fdiv><div style=\"padding:12px 18px;font:400 12.5px/1.5 var(--font-sans);color:var(--text-muted)\">Descriptions, secondary copy, labels<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.1fr 1fr 1fr 1.6fr;border-top:1px solid var(--border);font:500 12.5px/1.5 var(--font-mono);color:var(--text)\"><div style=\"padding:12px 18px;background:var(--surface-2)\">--primary<\u002Fdiv><div style=\"padding:12px 14px;display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:14px;border-radius:4px;background:#F2740E;border:1px solid var(--border-strong)\"><\u002Fspan>#F2740E<\u002Fdiv><div style=\"padding:12px 14px;display:flex;align-items:center;gap:8px\"><span style=\"width:14px;height:14px;border-radius:4px;background:#FF8A2B;border:1px solid var(--border-strong)\"><\u002Fspan>#FF8A2B<\u002Fdiv><div style=\"padding:12px 18px;font:400 12.5px/1.5 var(--font-sans);color:var(--text-muted)\">Primary button, active nav, focus accent<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.1fr 1fr 1fr 1.6fr;border-top:1px solid var(--border);font:500 12.5px/1.5 var(--font-mono);color:var(--text)\"><div style=\"padding:12px 18px;background:var(--surface-2)\">--ring<\u002Fdiv><div style=\"padding:12px 14px;font:400 12px/1.5 var(--font-sans);color:var(--text-muted)\">orange @ 35%<\u002Fdiv><div style=\"padding:12px 14px;font:400 12px/1.5 var(--font-sans);color:var(--text-muted)\">orange @ 40%<\u002Fdiv><div style=\"padding:12px 18px;font:400 12.5px/1.5 var(--font-sans);color:var(--text-muted)\">3px focus halo on every interactive element<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div data-code=\"true\" style=\"position:relative;margin-top:20px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);overflow:hidden\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 10px 9px 16px;border-bottom:1px solid var(--border)\">\n            <span style=\"font:700 10.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">tokens.css<\u002Fspan>\n            <button sc-camel-on-click=\"{{ copy }}\" style=\"border:1px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:7px;padding:5px 11px;font:600 11px/1 var(--font-sans);cursor:pointer\" style-hover=\"color:var(--primary);border-color:var(--primary)\">Copy<\u002Fbutton>\n          <\u002Fdiv>\n          <pre data-scroll=\"true\" style=\"margin:0;padding:16px;overflow:auto;font:400 12.5px/1.75 var(--font-mono);color:var(--text-muted)\">:root {\n  --background: 40 12% 97%;      /* #F8F7F6 */\n  --foreground: 40 6% 10%;       /* #1A1917 */\n  --card: 0 0% 100%;\n  --muted: 40 6% 95%;\n  --muted-foreground: 30 4% 34%;\n  --border: 36 8% 88%;\n  --primary: 27 89% 50%;         /* DSW orange #F2740E */\n  --primary-foreground: 0 0% 100%;\n  --secondary: 230 86% 26%;      /* DSW navy #091F7C */\n  --accent: 248 71% 59%;         /* #5B4BE0 */\n  --destructive: 6 63% 46%;      /* #C0392B */\n  --success: 143 64% 29%;        /* #1B7A3D */\n  --warning: 39 88% 42%;         /* #C9870C */\n  --ring: 27 89% 50%;\n  --radius: 0.625rem;\n}\n\n.dark {\n  --background: 228 40% 6%;      /* #0A0C16 */\n  --foreground: 228 33% 96%;\n  --card: 230 40% 11%;\n  --muted: 230 34% 14%;\n  --muted-foreground: 227 20% 70%;\n  --border: 230 30% 21%;\n  --primary: 27 100% 58%;        /* #FF8A2B */\n  --primary-foreground: 25 90% 6%;\n  --secondary: 228 51% 67%;\n  --accent: 253 87% 73%;\n  --destructive: 6 82% 66%;\n  --success: 143 55% 53%;\n  --warning: 38 78% 57%;\n}<\u002Fpre>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px\">\n          <div style=\"border:1px solid var(--border);border-left:3px solid var(--success);border-radius:12px;background:var(--surface);padding:18px 20px\">\n            <strong style=\"display:flex;align-items:center;gap:8px;font:700 13px/1.3 var(--font-sans);color:var(--success)\"><span data-icon=\"true\" style=\"--u:url(&quot;24238716-c924-44a4-9e27-3718a8813fea&quot;)\"><\u002Fspan>Do<\u002Fstrong>\n            <ul style=\"margin:10px 0 0;padding-left:18px;font:400 13.5px/1.75 var(--font-sans);color:var(--text-muted)\"><li>Use <code style=\"font:500 12.5px var(--font-mono);color:var(--text)\">--primary<\u002Fcode> for exactly one action per screen region.<\u002Fli><li>Pair every status colour with an icon or text label.<\u002Fli><li>Test both themes before shipping a screen.<\u002Fli><\u002Ful>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-left:3px solid var(--danger);border-radius:12px;background:var(--surface);padding:18px 20px\">\n            <strong style=\"display:flex;align-items:center;gap:8px;font:700 13px/1.3 var(--font-sans);color:var(--danger)\"><span data-icon=\"true\" style=\"--u:url(&quot;b1dafb6f-a46c-44ad-b000-f9e2dfb5a867&quot;)\"><\u002Fspan>Don't<\u002Fstrong>\n            <ul style=\"margin:10px 0 0;padding-left:18px;font:400 13.5px/1.75 var(--font-sans);color:var(--text-muted)\"><li>Tint large surfaces orange — it reads as an alert.<\u002Fli><li>Use colour as the only carrier of meaning.<\u002Fli><li>Introduce a new hue for a one-off chart series.<\u002Fli><\u002Ful>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3 style=\"margin:44px 0 16px;font:700 16px/1.3 var(--font-sans);letter-spacing:-.01em\">Dark mode comfort rules<\u002Fh3>\n        <p style=\"margin:0 0 18px;max-width:74ch;font:400 14px/1.7 var(--font-sans);color:var(--text-muted)\">Dark mode is not the light palette inverted. Operators sit in this product for hours, so the dark theme is tuned for low strain rather than maximum contrast — near-black backgrounds with near-white text produce halation and afterimages, especially on the dense tables and log views in Monitoring.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px\">\n          <div style=\"border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:8px\"><strong style=\"font:700 13px/1.3 var(--font-sans)\">Never pure black or pure white<\u002Fstrong><p style=\"margin:0;font:400 12.5px/1.65 var(--font-sans);color:var(--text-muted)\">Page sits at <code style=\"font:500 11.5px var(--font-mono)\">#15171E<\u002Fcode>, body text at <code style=\"font:500 11.5px var(--font-mono)\">#E4E6EC<\u002Fcode>. Roughly 13:1 — comfortably above AA, well below the 18:1 that causes glare.<\u002Fp><\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:8px\"><strong style=\"font:700 13px/1.3 var(--font-sans)\">Desaturate the brand<\u002Fstrong><p style=\"margin:0;font:400 12.5px/1.65 var(--font-sans);color:var(--text-muted)\">Orange lightens and loses chroma to <code style=\"font:500 11.5px var(--font-mono)\">#F5904A<\u002Fcode>. Fully saturated hues vibrate against a dark field and fatigue the eye fastest.<\u002Fp><\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:8px\"><strong style=\"font:700 13px/1.3 var(--font-sans)\">Elevation by surface, not shadow<\u002Fstrong><p style=\"margin:0;font:400 12.5px/1.65 var(--font-sans);color:var(--text-muted)\">Raised layers step up through <code style=\"font:500 11.5px var(--font-mono)\">--surface-2/3<\u002Fcode>. Dark shadows are softened to roughly half their light-mode opacity.<\u002Fp><\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:20px;display:flex;flex-direction:column;gap:8px\"><strong style=\"font:700 13px/1.3 var(--font-sans)\">Soft-tint backgrounds, not solid fills<\u002Fstrong><p style=\"margin:0;font:400 12.5px/1.65 var(--font-sans);color:var(--text-muted)\">Status and brand soft tokens are dark, low-chroma versions of the hue — a bright status chip is the single loudest thing on a dark screen.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"typography\" style=\"padding:72px 0 76px;border-bottom:1px solid var(--border)\">\n        <span style=\"font:700 11px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--primary)\">01.2 — Foundations<\u002Fspan>\n        <h2 style=\"margin:14px 0 0;font:800 34px/1.12 var(--font-sans);letter-spacing:-.025em\">Typography<\u002Fh2>\n        <p style=\"margin:14px 0 0;max-width:72ch;font:400 15.5px/1.7 var(--font-sans);color:var(--text-muted);text-wrap:pretty\"><strong style=\"color:var(--text)\">Plus Jakarta Sans<\u002Fstrong> is the single UI typeface — a geometric humanist sans whose open apertures survive the 12–13px sizes this product lives at, and whose 800 weight gives headings the density DSW's wordmark has. <strong style=\"color:var(--text)\">JetBrains Mono<\u002Fstrong> carries all machine content: IDs, keys, JSON, prompts, code. Documents and exports fall back to Arial per the DSW brand standard.<\u002Fp>\n\n        <div style=\"margin-top:32px;border:1px solid var(--border);border-radius:16px;background:var(--surface);overflow:hidden\">\n          <div style=\"display:grid;grid-template-columns:150px minmax(0,1fr) 220px;gap:0;background:var(--surface-2);border-bottom:1px solid var(--border);font:700 10.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\"><div style=\"padding:12px 22px\">Role<\u002Fdiv><div style=\"padding:12px 14px\">Specimen<\u002Fdiv><div style=\"padding:12px 22px\">Spec<
