text-muted)\"><strong style=\"color:var(--text)\">Order is fixed.<\u002Fstrong> Header → stats → search → filter bar → collection. Never reorder; users navigate these pages by muscle memory.<\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:16px 18px;font:400 12.5px/1.65 var(--font-sans);color:var(--text-muted)\"><strong style=\"color:var(--text)\">Stats are read-only.<\u002Fstrong> Two to four tiles, whole numbers, no sparkline unless the page has no chart elsewhere.<\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:16px 18px;font:400 12.5px/1.65 var(--font-sans);color:var(--text-muted)\"><strong style=\"color:var(--text)\">View mode persists<\u002Fstrong> per collection in local storage. Grid is the default for ≤50 items, list above that.<\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3 style=\"margin:52px 0 6px;font:700 18px/1.3 var(--font-sans);letter-spacing:-.012em\">P2 · Builder page<\u002Fh3>\n        <p style=\"margin:0 0 18px;max-width:70ch;font:400 13.5px/1.7 var(--font-sans);color:var(--text-muted)\">A sticky action header, a basic-information card, then a tab strip that steps through the components. Tabs are non-linear — a user may configure Knowledge before Model — so nothing is disabled and progress is shown, never enforced.<\u002Fp>\n        <div style=\"border:1px solid var(--border);border-radius:16px;background:var(--bg);padding:26px;display:flex;flex-direction:column;gap:18px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap\">\n            <div style=\"display:flex;gap:14px;align-items:flex-start\"><span data-icon=\"true\" style=\"--u:url(&quot;18465880-be27-428f-bc02-5d7335ed8c9b&quot;);font-size:22px;color:var(--text-muted);cursor:pointer;margin-top:4px\"><\u002Fspan><div style=\"display:flex;flex-direction:column;gap:5px\"><h4 style=\"margin:0;font:700 26px/1.15 var(--font-sans);letter-spacing:-.022em\">Agent Builder<\u002Fh4><p style=\"margin:0;font:400 13.5px/1.5 var(--font-sans);color:var(--text-muted)\">Configure your AI agent with custom prompts, models and tools<\u002Fp><\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;gap:10px;flex-wrap:wrap\">\n              <button style=\"display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border:1px solid var(--primary);border-radius:999px;background:transparent;color:var(--primary);font:600 13.5px/1 var(--font-sans);cursor:pointer\" style-hover=\"background:var(--primary-soft)\"><span data-icon=\"true\" style=\"--u:url(&quot;c6a6dc99-b1cd-4dba-b6ae-b57f6c583218&quot;);font-size:16px\"><\u002Fspan>API<\u002Fbutton>\n              <button style=\"display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border:1px solid var(--primary);border-radius:999px;background:transparent;color:var(--primary);font:600 13.5px/1 var(--font-sans);cursor:pointer\" style-hover=\"background:var(--primary-soft)\"><span data-icon=\"true\" style=\"--u:url(&quot;16ba515b-6c31-429f-bf25-684b715a33f6&quot;);font-size:16px\"><\u002Fspan>Test<\u002Fbutton>\n              <button style=\"display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 20px;border:1px solid var(--primary);border-radius:999px;background:var(--primary);color:var(--primary-fg);font:600 13.5px/1 var(--font-sans);cursor:pointer\" style-hover=\"background:var(--primary-hover)\"><span data-icon=\"true\" style=\"--u:url(&quot;61f3a044-3544-4ef1-95bd-512ac901cb8d&quot;);font-size:16px\"><\u002Fspan>Save agent<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:18px\">\n            <div style=\"display:flex;flex-direction:column;gap:4px\"><h5 style=\"margin:0;font:700 18px/1.3 var(--font-sans);letter-spacing:-.014em\">Basic information<\u002Fh5><p style=\"margin:0;font:400 13px/1.5 var(--font-sans);color:var(--text-muted)\">Set up the basic details for your agent<\u002Fp><\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n              <label style=\"display:flex;flex-direction:column;gap:7px\"><span style=\"font:600 13px/1.3 var(--font-sans)\">Agent name<\u002Fspan><input type=\"text\" value=\"Policy Information Extractor\" style=\"height:40px;padding:0 13px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font:400 13.5px/1 var(--font-sans);outline:none\" style-focus=\"border-color:var(--primary);box-shadow:0 0 0 3px var(--ring)\"><\u002Flabel>\n              <label style=\"display:flex;flex-direction:column;gap:7px\"><span style=\"font:600 13px/1.3 var(--font-sans)\">Description<\u002Fspan><input type=\"text\" value=\"Extracts critical information from life insurance policy documents\" style=\"height:40px;padding:0 13px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font:400 13.5px/1 var(--font-sans);outline:none\" style-focus=\"border-color:var(--primary);box-shadow:0 0 0 3px var(--ring)\"><\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:relative;display:flex;gap:4px;padding:4px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);overflow-x:auto\" data-scroll=\"true\">\n            <button data-tab=\"true\" data-on=\"{{ tabPromptOn }}\" sc-camel-on-click=\"{{ setTabPrompt }}\">Prompt<\u002Fbutton>\n            <button data-tab=\"true\" data-on=\"{{ tabModelOn }}\" sc-camel-on-click=\"{{ setTabModel }}\">Model<\u002Fbutton>\n            <button data-tab=\"true\" data-on=\"{{ tabToolsOn }}\" sc-camel-on-click=\"{{ setTabTools }}\">Tools<\u002Fbutton>\n            <button data-tab=\"true\" data-on=\"{{ tabKnowledgeOn }}\" sc-camel-on-click=\"{{ setTabKnowledge }}\">Knowledge<\u002Fbutton>\n          <\u002Fdiv>\n          <div data-tabpanel=\"true\" style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:8px\"><h5 style=\"margin:0;font:700 18px/1.3 var(--font-sans);letter-spacing:-.014em\">{{ tabBody }}<\u002Fh5><\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3 style=\"margin:52px 0 6px;font:700 18px/1.3 var(--font-sans);letter-spacing:-.012em\">P3 · API panel<\u002Fh3>\n        <p style=\"margin:0 0 18px;max-width:70ch;font:400 13.5px/1.7 var(--font-sans);color:var(--text-muted)\">Identifiers first, then the request in the caller's own language. Secrets are masked until revealed, and every value has a one-click copy — this panel is the handoff point between the studio and a partner's codebase.<\u002Fp>\n        <div style=\"border:1px solid var(--border);border-radius:16px;background:var(--surface);overflow:hidden\">\n          <div style=\"padding:22px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;border-bottom:1px solid var(--border)\">\n            <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 11px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">Agent ID<\u002Fspan><div style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)\"><span style=\"flex:1;font:500 12.5px/1 var(--font-mono);color:var(--text)\">ag_7f2c91e4<\u002Fspan><span data-icon=\"true\" style=\"--u:url(&quot;e3a46b22-abab-45fe-af97-e178bd1d8298&quot;);font-size:15px;color:var(--text-subtle);cursor:pointer\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 11px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">API key<\u002Fspan><div style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)\"><span style=\"flex:1;font:500 12.5px/1 var(--font-mono);color:var(--text)\">sk-••••••••••••••4d19<\u002Fspan><span data-icon=\"true\" style=\"--u:url(&quot;51964dae-8681-4c94-9c77-69f30bb80feb&quot;);font-size:15px;color:var(--text-subtle);cursor:pointer\"><\u002Fspan><span data-icon=\"true\" style=\"--u:url(&quot;e3a46b22-abab-45fe-af97-e178bd1d8298&quot;);font-size:15px;color:var(--text-subtle);cursor:pointer\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px\"><span style=\"font:600 11px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">Endpoint<\u002Fspan><div style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2)\"><span style=\"flex:1;font:500 12.5px/1 var(--font-mono);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">POST /v1/agents/ag_7f2c/infer<\u002Fspan><span data-icon=\"true\" style=\"--u:url(&quot;e3a46b22-abab-45fe-af97-e178bd1d8298&quot;);font-size:15px;color:var(--text-subtle);cursor:pointer\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding:18px 24px 0\"><div style=\"position:relative;display:flex;gap:4px;padding:4px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);max-width:420px\"><button data-tab=\"true\" data-on=\"{{ apiCurlOn }}\" sc-camel-on-click=\"{{ setApiCurl }}\">cURL<\u002Fbutton><button data-tab=\"true\" data-on=\"{{ apiJsOn }}\" sc-camel-on-click=\"{{ setApiJs }}\">JavaScript<\u002Fbutton><button data-tab=\"true\" data-on=\"{{ apiPyOn }}\" sc-camel-on-click=\"{{ setApiPy }}\">Python<\u002Fbutton><\u002Fdiv><\u002Fdiv>\n          <div data-code=\"true\" style=\"margin:16px 24px 24px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);overflow:hidden\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;padding:9px 10px 9px 16px;border-bottom:1px solid var(--border)\"><span style=\"font:700 10.5px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-subtle)\">Request<\u002Fspan><button sc-camel-on-click=\"{{ copy }}\" style=\"border:1px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:7px;padding:5px 11px;font:600 11px/1 var(--font-sans);cursor:pointer\" style-hover=\"color:var(--primary);border-color:var(--primary)\">Copy<\u002Fbutton><\u002Fdiv>\n            <pre data-tabpanel=\"true\" data-scroll=\"true\" style=\"margin:0;padding:16px;overflow:auto;font:400 12.5px/1.75 var(--font-mono);color:var(--text-muted);min-height:220px\">{{ apiSnippet }}<\u002Fpre>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3 style=\"margin:52px 0 6px;font:700 18px/1.3 var(--font-sans);letter-spacing:-.012em\">P4 · Destructive confirmation<\u002Fh3>\n        <p style=\"margin:0 0 18px;max-width:70ch;font:400 13.5px/1.7 var(--font-sans);color:var(--text-muted)\">Deleting an agent, prompt, LLM or guard suite is irreversible and can silently break live integrations. The dialog names the object, states the blast radius, and requires the user to type the name. The confirm button stays disabled until the typed value matches.<\u002Fp>\n        <div style=\"border:1px solid var(--border);border-radius:16px;background:var(--surface);padding:26px;display:flex;flex-wrap:wrap;gap:26px;align-items:center\">\n          <button sc-camel-on-click=\"{{ openConfirm }}\" style=\"display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border:1px solid var(--danger);border-radius:999px;background:transparent;color:var(--danger);font:600 13.5px/1 var(--font-sans);cursor:pointer\" style-hover=\"background:var(--danger-soft)\"><span data-icon=\"true\" style=\"--u:url(&quot;444e91da-e364-4616-98dd-f871482cfd95&quot;);font-size:16px\"><\u002Fspan>Delete agent<\u002Fbutton>\n          <ul style=\"margin:0;padding-left:18px;font:400 13px/1.8 var(--font-sans);color:var(--text-muted);max-width:56ch\"><li>Title names the object: \"Delete Policy Information Extractor?\"<\u002Fli><li>Body states what else breaks — versions, pinned integrations, test suites.<\u002Fli><li>Confirm label repeats the verb; never \"OK\".<\u002Fli><li>Escape and the scrim both cancel. Cancel is always first in the DOM.<\u002Fli><\u002Ful>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"a11y\" style=\"padding:72px 0 76px;border-bottom:1px solid var(--border)\">\n        <span style=\"font:700 11px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--primary)\">03.1 — Applied<\u002Fspan>\n        <h2 style=\"margin:14px 0 0;font:800 34px/1.12 var(--font-sans);letter-spacing:-.025em\">Accessibility<\u002Fh2>\n        <p style=\"margin:14px 0 0;max-width:72ch;font:400 15.5px/1.7 var(--font-sans);color:var(--text-muted);text-wrap:pretty\">Target is WCAG 2.2 AA in both themes. These are the rules a partner implementation is audited against.<\u002Fp>\n\n        <h3 style=\"margin:40px 0 16px;font:700 16px/1.3 var(--font-sans);letter-spacing:-.01em\">Contrast<\u002Fh3>\n        <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow:hidden\">\n          <div data-thead=\"true\" style=\"display:grid;grid-template-columns:1.6fr .8fr .8fr .9fr;font:700 11px/1 var(--font-sans);letter-spacing:.07em;text-transform:uppercase\"><div style=\"padding:13px 20px\">Pair<\u002Fdiv><div style=\"padding:13px 14px\">Light<\u002Fdiv><div style=\"padding:13px 14px\">Dark<\u002Fdiv><div style=\"padding:13px 20px\">Requirement<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.6fr .8fr .8fr .9fr;border-top:1px solid var(--border);font:400 13px/1.5 var(--font-sans)\"><div style=\"padding:12px 20px;color:var(--text)\">Body text on surface<\u002Fdiv><div style=\"padding:12px 14px;font:600 13px/1.5 var(--font-mono);color:var(--success)\">11.2 : 1<\u002Fdiv><div style=\"padding:12px 14px;font:600 13px/1.5 var(--font-mono);color:var(--success)\">13.2 : 1<\u002Fdiv><div style=\"padding:12px 20px;color:var(--text-muted)\">4.5 : 1<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.6fr .8fr .8fr .9fr;border-top:1px solid var(--border);font:400 13px/1.5 var(--font-sans)\"><div style=\"padding:12px 20px;color:var(--text)\">Muted text on surface<\u002Fdiv><div style=\"padding:12px 14px;font:600 13px/1.5 var(--font-mono);color:var(--success)\">6.9 : 1<\u002Fdiv><div style=\"padding:12px 14px;font:600 13px/1.5 var(--font-mono);color:var(--success)\">7.3 : 1<\u002Fdiv><div style=\"padding:12px 20px;color:var(--text-muted)\">4.5 : 1<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.6fr .8fr .8fr .9fr;border-top:1px solid var(--border);font:400 13px/1.5 var(--font-sans)\"><div style=\"padding:12px 20px;color:var(--text)\">Button label on primary <span style=\"color:var(--text-subtle)\">(white / near-black)<\u002Fspan><\u002Fdiv><div style=\"padding:12px 14px;font:600 13px/1.5 var(--font-mono);color:var(--warning)\">3.1 : 1<\u002Fdiv><div style=\"padding:12px 14px;font:600 13px/1.5 var(--font-mono);color:var(--success)\">6.3 : 1<\u002Fdiv><div style=\"padding:12px 20px;color:var(--text-muted)\">3 : 1 — 14px bold min<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.6fr .8fr .8fr .9fr;border-top:1px solid var(--border);font:400 13px/1.5 var(--font-sans)\"><div style=\"padding:12px 20px;color:var(--text)\">Primary text on primary-soft<\u002Fdiv><div style=\"padding:12px 14px;font:600 13px/1.5 var(--font-mono);color:var(--success)\">7.8 : 1<\u002Fdiv><div style=\"padding:12px 14px;font:600 13px/1.5 var(--font-mono);color:var(--success)\">8.6 : 1<\u002Fdiv><div style=\"padding:12px 20px;color:var(--text-muted)\">4.5 : 1<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.6fr .8fr .8fr .9fr;border-top:1px solid var(--border);font:400 13px/1.5 var(--font-sans)\"><div style=\"padding:12px 20px;color:var(--text)\">Border on surface (non-text)<\u002Fdiv><div style=\"padding:12px 14px;font:600 13px/1.5 var(--font-mono);color:var(--warning)\">1.4 : 1<\u002Fdiv><div style=\"padding:12px 14px;font:600 13px/1.5 var(--font-mono);color:var(--warning)\">1.3 : 1<\u002Fdiv><div style=\"padding:12px 20px;color:var(--text-muted)\">decorative — pair with a label<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.6fr .8fr .8fr .9fr;border-top:1px solid var(--border);font:400 13px/1.5 var(--font-sans)\"><div style=\"padding:12px 20px;color:var(--text)\">Subtle text on surface<\u002Fdiv><div style=\"padding:12px 14px;font:600 13px/1.5 var(--font-mono);color:var(--warning)\">3.7 : 1<\u002Fdiv><div style=\"padding:12px 14px;font:600 13px/1.5 var(--font-mono);color:var(--success)\">5.0 : 1<\u002Fdiv><div style=\"padding:12px 20px;color:var(--text-muted)\">3 : 1 — non-essential only<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top:12px;border:1px solid var(--border);border-left:3px solid var(--warning);border-radius:12px;background:var(--surface);padding:16px 20px;font:400 13px/1.7 var(--font-sans);color:var(--text-muted)\">White on DSW orange clears the 3:1 large-text threshold but not 4.5:1 — so primary buttons must stay at 13.5px semibold or larger, and orange is never used for body copy on a light surface. Where orange must carry small text, use <code style=\"font:500 12.5px var(--font-mono);color:var(--text)\">--primary-soft-fg<\u002Fcode> (#A84A05) on <code style=\"font:500 12.5px var(--font-mono);color:var(--text)\">--primary-soft<\u002Fcode>. In dark mode the button label flips to near-black <code style=\"font:500 12.5px var(--font-mono);color:var(--text)\">--primary-fg<\u002Fcode> (#20120A) on the lighter orange, which clears 6.3:1. <code style=\"font:500 12.5px var(--font-mono);color:var(--text)\">--text-subtle<\u002Fcode> is a non-essential tier — timestamps, IDs, hints — and never carries information that exists nowhere else.<\u002Fdiv>\n\n        <h3 style=\"margin:44px 0 16px;font:700 16px/1.3 var(--font-sans);letter-spacing:-.01em\">Focus, keyboard &amp; semantics<\u002Fh3>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px\">\n          <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:22px;display:flex;flex-direction:column;gap:14px\"><strong style=\"font:700 13.5px/1.3 var(--font-sans)\">Focus ring<\u002Fstrong><p style=\"margin:0;font:400 13px/1.7 var(--font-sans);color:var(--text-muted)\">A 3px <code style=\"font:500 12.5px var(--font-mono);color:var(--text)\">--ring<\u002Fcode> halo on <code style=\"font:500 12.5px var(--font-mono);color:var(--text)\">:focus-visible<\u002Fcode>, never <code style=\"font:500 12.5px var(--font-mono);color:var(--text)\">outline: none<\u002Fcode> without a replacement. Tab through this page to check.<\u002Fp><div style=\"display:flex;gap:12px;flex-wrap:wrap\"><span style=\"display:inline-flex;height:36px;align-items:center;padding:0 16px;border-radius:999px;background:var(--primary);color:var(--primary-fg);font:600 13px/1 var(--font-sans);box-shadow:0 0 0 3px var(--ring)\">Focused<\u002Fspan><span style=\"display:inline-flex;height:36px;align-items:center;padding:0 14px;border-radius:10px;border:1px solid var(--primary);color:var(--text);font:400 13px/1 var(--font-sans);box-shadow:0 0 0 3px var(--ring)\">Field<\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:22px;display:flex;flex-direction:column;gap:10px\"><strong style=\"font:700 13.5px/1.3 var(--font-sans)\">Keyboard contract<\u002Fstrong><ul style=\"margin:0;padding-left:18px;font:400 13px/1.8 var(--font-sans);color:var(--text-muted)\"><li>Tabs — <code style=\"font:500 12px var(--font-mono)\">←<\u002Fcode> <code style=\"font:500 12px var(--font-mono)\">→<\u002Fcode> move, <code style=\"font:500 12px var(--font-mono)\">Home<\u002Fcode> / <code style=\"font:500 12px var(--font-mono)\">End<\u002Fcode> jump<\u002Fli><li>Dialogs trap focus, <code style=\"font:500 12px var(--font-mono)\">Esc<\u002Fcode> closes, focus returns to the trigger<\u002Fli><li>Menus — arrows move, typing jumps, <code style=\"font:500 12px var(--font-mono)\">Esc<\u002Fcode> closes<\u002Fli><li>Chat — <code style=\"font:500 12px var(--font-mono)\">Enter<\u002Fcode> sends, <code style=\"font:500 12px var(--font-mono)\">Shift+Enter<\u002Fcode> newlines<\u002Fli><li>A visible \"Skip to content\" link precedes the sidebar<\u002Fli><\u002Ful><\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:22px;display:flex;flex-direction:column;gap:10px\"><strong style=\"font:700 13.5px/1.3 var(--font-sans)\">Semantics<\u002Fstrong><ul style=\"margin:0;padding-left:18px;font:400 13px/1.8 var(--font-sans);color:var(--text-muted)\"><li>Every icon-only control has <code style=\"font:500 12px var(--font-mono)\">aria-label<\u002Fcode>; decorative icons are <code style=\"font:500 12px var(--font-mono)\">aria-hidden<\u002Fcode><\u002Fli><li>Hover-revealed actions also appear on <code style=\"font:500 12px var(--font-mono)\">:focus-within<\u002Fcode><\u002Fli><li>Toasts and streaming responses live in <code style=\"font:500 12px var(--font-mono)\">aria-live=\"polite\"<\u002Fcode>; blocked responses use <code style=\"font:500 12px var(--font-mono)\">assertive<\u002Fcode><\u002Fli><li>Status is never colour alone — always a dot plus a word<\u002Fli><li>Charts ship a \"View as data\" table fallback<\u002Fli><\u002Ful><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsection>\n\n      <section id=\"voice\" style=\" rt\"><span data-icon=\"true\" style=\"--u:url(&quot;24238716-c924-44a4-9e27-3718a8813fea&quot;);font-size:15px;color:var(--success);margin-top:3px\"><\u002Fspan><span style=\"font:400 13px/1.6 var(--font-sans);color:var(--text-muted)\">Field labels are nouns: <strong style=\"color:var(--text)\">Agent name<\u002Fstrong>, not \"Enter the agent name\"<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:22px;display:flex;flex-direction:column;gap:14px\">\n            <strong style=\"font:700 13.5px/1.3 var(--font-sans)\">Errors<\u002Fstrong>\n            <div style=\"display:flex;flex-direction:column;gap:12px\">\n              <div style=\"padding:12px 14px;border-radius:10px;background:var(--success-soft);font:400 13px/1.6 var(--font-sans);color:var(--text)\"><strong style=\"color:var(--success)\">Write<\u002Fstrong><br>Deployment failed — OpenRouter rejected the API key. Replace it in the model configuration and deploy again.<\u002Fdiv>\n              <div style=\"padding:12px 14px;border-radius:10px;background:var(--danger-soft);font:400 13px/1.6 var(--font-sans);color:var(--text)\"><strong style=\"color:var(--danger)\">Not this<\u002Fstrong><br>Something went wrong. Please try again later.<\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"margin:0;font:400 12.5px/1.6 var(--font-sans);color:var(--text-subtle)\">Name what failed, name the cause, name the next action. Include an error code only in a copyable detail row.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:22px;display:flex;flex-direction:column;gap:14px\">\n            <strong style=\"font:700 13.5px/1.3 var(--font-sans)\">Empty states<\u002Fstrong>\n            <p style=\"margin:0;font:400 13px/1.7 var(--font-sans);color:var(--text-muted)\">Three lines: what belongs here, why it m word: false },\n    slider: 0.7, topk: 5, copied: '', chatSent: false, accordion: 'a',\n    load: 'idle', boot: false, loginOpen: false, faq: {}\n  };\n\n  componentDidMount() {\n    const saved = localStorage.getItem('dsw-sg-theme');\n    if (saved) this.setState({ theme: saved });\n    else if (this.props.defaultTheme === 'dark') this.setState({ theme: 'dark' });\n    this._applyProps();\n    this._spy();\n    this._key = (e) => {\n      if (e.altKey && (e.key === 't' || e.key === 'T')) this.toggleTheme();\n      if (e.key === 'Escape') this.setState({ modal: false, confirm: false, drawer: false, boot: false });\n    };\n    window.addEventListener('keydown', this._key);\n    this._resize = () => { this._syncTabs(); this._syncEmbed(); };\n    window.addEventListener('resize', this._resize);\n    requestAnimationFrame(this._syncTabs);\n    setTimeout(() => { this._syncTabs(); this._syncEmbed(); }, 300);\n  }\n  componentDidUpdate() { this._applyProps(); this._syncTabs(); this._syncEmbed(); }\n\n  _syncEmbed = () => {\n    const root = this._root;\n    if (!root) return;\n    root.querySelectorAll('[data-embed]').forEach(box => {\n      const frame = box.querySelector('[data-embed-frame]');\n      if (!frame || !box.offsetWidth) return;\n      const scale = box.offsetWidth / 1440;\n      frame.style.transform = 'scale(' + scale + ')';\n      box.style.height = Math.round(900 * scale) + 'px';\n    });\n  };\n\n  _syncTabs = () => {\n    const root = this._root;\n    if (!root) return;\n    const groups = new Set();\n    root.querySelectorAll('[data-tab]').forEach(b => { if (b.parentElement) groups.add(b.parentElement); });\n    groups.forEach(g => {\n      let ind = g.querySelector(':scope > [data-tab-ind]');\n      if (!ind) { ind = document.createElement('span'); ind.setAttribute('data-tab-ind', ''); g.appendChild(ind); }\n      const act = g.querySelector('[data-tab][data-on=\"true\"]');\n      if (!act) { ind.style.opacity = '0'; return; }\n      ind.style.opacit antic tokens in section 01.1. Replace the token values — never the component internals — and the whole surface follows, in both themes. The DSW mark is the one element that stays.'],\n      ['Which font do we ship if Plus Jakarta Sans is unavailable?', 'The stack falls back to system-ui, then Segoe UI. Metrics differ slightly, so re-check any fixed-height control at 13.5px and above. Do not substitute a display face; the type scale assumes a neutral grotesque.'],\n      ['When is orange allowed on a large surface?', 'Never as a background for content. Orange marks the single primary action and the current location. Its soft tint is available for badges and small emphasis panels, but a full-width orange band reads as an alert and will be misread under time pressure.'],\n      ['How do we handle a component this guide does not cover?', 'Compose it from the primitives here before inventing one. If it genuinely does not exist, build it from the same tokens, document every state (default, hover, focus, active, disabled, loading, empty, error) and submit it for inclusion in the next version.'],\n      ['Does dark mode need a separate contrast audit?', 'Yes, and the numbers are already in section 03.1. Dark mode is tuned for long sessions, not maximum contrast — body text sits near 13:1 rather than 18:1, and saturated hues are lightened and de-chromatised. Any new colour must be checked in both themes before it ships.'],\n      ['What is the minimum size for the animated brand loader?', '160px wide. Below that the wordmark stops being legible and the motion lines merge, so use the arc spinner instead. The brand loader is also limited to one appearance per session — it means the platform is starting, not that a request is running.']\n    ];\n  }\n\n  renderVals() {\n    const s = this.state;\n    const on = (a, b) => (a === b ? 'true' : 'false');\n    return {\n      hybridOn: on(s.checks.hybrid, true), semanticOn: on(s.checks.semantic, true), keywordOn: on(s.checks.keyword
